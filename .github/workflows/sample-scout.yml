name: Sample scout

# Compatibility dispatcher for PR-only ElevenLabs POC runs. The workflow file
# path already exists on main, so GitHub allows workflow_dispatch with --ref to
# this branch before the new ai-sfx-elevenlabs.yml workflow is merged.
# It does NOT run the archived Freesound/sample-scout flow.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Compatibility field; ignored by v2 POC"
        type: choice
        options: [freesound, archive.org]
        default: freesound
        required: true
      query:
        description: "Compatibility field; use comma-separated story IDs for v2 POC"
        type: string
        default: "1,2,3,4,5"
        required: true
      count:
        description: "Compatibility field; generation limit"
        type: choice
        options: ["1", "2", "3", "4", "5"]
        default: "5"
        required: true
      sort:
        description: "Compatibility field; ignored by v2 POC"
        type: choice
        options: [rating_desc, downloads_desc, score]
        default: rating_desc
        required: true

permissions:
  contents: read

env:
  COLLECTION_CSV: fabuły270926.csv
  SCENARIOS: data/samples/scenarios.jsonl
  OUT_DIR: audio/samples
  MANIFEST: data/samples/generated-manifest.jsonl

jobs:
  generate-poc:
    if: startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Explain compatibility inputs
        run: |
          echo "v2 ElevenLabs POC compatibility dispatcher"
          echo "source=${{ inputs.source }} ignored"
          echo "query/story_ids=${{ inputs.query }}"
          echo "count/limit=${{ inputs.count }}"
          echo "sort=${{ inputs.sort }} ignored"
      - name: Refresh catalog from collection
        run: python scripts/import_collection.py "$COLLECTION_CSV" --output data/catalog.json
      - name: Validate scenarios
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json
      - name: Generate MP3s with ElevenLabs
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          python scripts/elevenlabs_sample_scout.py \
            --scenarios "$SCENARIOS" \
            --ids "${{ inputs.query }}" \
            --batch b001 \
            --limit "${{ inputs.count }}" \
            --out "$OUT_DIR" \
            --manifest "$MANIFEST" \
            --prompt-influence 0.35
      - name: Build flat ZIP
        run: python scripts/build_pack.py --src "$OUT_DIR" --output build/samples-latest.zip
      - name: Build HTML library
        run: python scripts/build_site.py --out site/generated
      - name: Upload generated ZIP, manifest, and HTML library
        uses: actions/upload-artifact@v4
        with:
          name: samples-elevenlabs-b001
          path: |
            build/samples-latest.zip
            data/samples/generated-manifest.jsonl
            site/generated
          if-no-files-found: error
