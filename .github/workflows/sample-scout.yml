name: Sample scout

# The GitHub runner has ordinary internet access while the Arena sandbox is
# intentionally restricted. This workflow retrieves a small CC0 candidate
# batch, commits it on main, and lets an agent inspect it after git fetch.
# Candidates are never automatically registered as production sources.

# Two triggers on purpose:
#   * workflow_dispatch — the owner clicks Run workflow in the Actions tab;
#   * repository_dispatch — the Arena agent sends an API event. The sandbox
#     token carries contents:write but not actions:write, so POST to
#     /actions/workflows/*/dispatches answers 403 while POST /dispatches
#     works. Payload fields mirror the manual inputs.
on:
  repository_dispatch:
    types: [sample-scout]
  workflow_dispatch:
    inputs:
      source:
        description: "Źródło kandydatów"
        type: choice
        options: [freesound, archive.org]
        default: freesound
        required: true
      query:
        description: 'Zapytanie, np. "wolf howl" albo "steam vent"'
        type: string
        required: true
      count:
        description: "Liczba kandydatów (maks. 5)"
        type: choice
        options: ["1", "2", "3", "4", "5"]
        default: "5"
        required: true
      sort:
        description: "Ranking Freesound (dla archive.org bez znaczenia — zawsze wg pobrań)"
        type: choice
        options: [rating_desc, downloads_desc, score]
        default: rating_desc
        required: true

permissions:
  contents: write

concurrency:
  group: sample-scout
  cancel-in-progress: false

jobs:
  scout:
    # Candidate files are committed for the next Arena session, so the run must
    # come from a branch we control. `main` covers repository_dispatch (GitHub
    # always runs that trigger on the default branch) and the normal manual run;
    # `arena/**` lets the owner test a scout fix from the session branch before
    # it is merged — the commit then lands on that same branch, never on main.
    # Anything else (a stray or forked PR branch) is still refused.
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clear the previous bounded candidate batch
        run: rm -rf legacy/source/sample_scout
      - name: Fetch community-ranked CC0 candidates
        id: scout
        # Nie przerywamy joba: log z porażki MUSI trafić do repo, bo token
        # sandboksa Areny nie ma uprawnień do czytania logów Actions.
        continue-on-error: true
        env:
          FREESOUND_TOKEN: ${{ secrets.FREESOUND_TOKEN }}
          SCOUT_SOURCE: ${{ inputs.source || github.event.client_payload.source || 'freesound' }}
          SCOUT_QUERY: ${{ inputs.query || github.event.client_payload.query }}
          SCOUT_COUNT: ${{ inputs.count || github.event.client_payload.count || '5' }}
          SCOUT_SORT: ${{ inputs.sort || github.event.client_payload.sort || 'rating_desc' }}
        run: |
          set -o pipefail
          {
            echo "=== sample-scout $(date -u +%FT%TZ) ==="
            echo "source=$SCOUT_SOURCE query=$SCOUT_QUERY count=$SCOUT_COUNT sort=$SCOUT_SORT"
            if [ -z "$FREESOUND_TOKEN" ]; then echo "FREESOUND_TOKEN: BRAK/PUSTY"; else echo "FREESOUND_TOKEN: ustawiony (${#FREESOUND_TOKEN} znaków)"; fi
          } | tee scout_run.log
          python scripts/sample_scout.py \
            --source "$SCOUT_SOURCE" \
            --query "$SCOUT_QUERY" \
            --count "$SCOUT_COUNT" \
            --sort "$SCOUT_SORT" \
            --out legacy/source/sample_scout 2>&1 | tee -a scout_run.log
      - name: Commit candidate batch (albo log porażki)
        env:
          SCOUT_SOURCE: ${{ inputs.source || github.event.client_payload.source || 'freesound' }}
          SCOUT_COUNT: ${{ inputs.count || github.event.client_payload.count || '5' }}
          SCOUT_OUTCOME: ${{ steps.scout.outcome }}
        run: |
          git config user.name "sample-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p legacy/source/sample_scout
          if [ "$SCOUT_OUTCOME" != "success" ]; then
            cp scout_run.log legacy/source/sample_scout/error.log
            MSG="Sample scout FAILED: ${SCOUT_SOURCE} — log w legacy/source/sample_scout/error.log [skip ci]"
          else
            rm -f legacy/source/sample_scout/error.log
            MSG="Sample scout: ${SCOUT_SOURCE} (${SCOUT_COUNT} candidates) [skip ci]"
          fi
          git add --all legacy/source/sample_scout
          if git diff --cached --quiet; then
            echo "Brak zmian w paczce kandydatów."
          else
            git commit -m "$MSG"
            # Push back to the branch this run was started from. Agent bywa
            # aktywny na gałęzi w trakcie runa (lekcja 2026-09-24: non-fast-
            # forward), więc przed pushem rebase i do trzech prób.
            for i in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              [ "$i" = 3 ] && exit 1
              sleep 5
            done
            echo "$MSG (gałąź ${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Status zwiadu
        if: steps.scout.outcome != 'success'
        run: |
          echo "Zwiad nie powiódł się — log błędu zacommitowany do repo." >> "$GITHUB_STEP_SUMMARY"
          exit 1
