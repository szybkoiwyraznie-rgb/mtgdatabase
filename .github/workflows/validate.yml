name: Validate project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install numpy soundfile lameenc av
      - name: Compile Python files
        run: python -m compileall -q scripts
      - name: Test signature system
        run: python scripts/test_signature_system.py
      - name: Test Sample Scout connectors
        run: python scripts/test_sample_scout.py
      - name: Validate collection CSV
        run: python scripts/validate_stories.py kolekcja.csv
      - name: Test collection import
        run: python scripts/import_collection.py kolekcja.csv --output /tmp/catalog.json
      - name: Build pack from signatures (smoke)
        run: python scripts/build_pack.py --output /tmp/pack.zip
      - name: Build gallery (smoke)
        run: python scripts/build_site.py --out /tmp/site-out
