name: Validate project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q scripts
      - name: Run v2 sample tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate collection CSV/TSV
        run: python scripts/validate_stories.py fabuły270926.csv
      - name: Refresh catalog from collection
        run: python scripts/import_collection.py fabuły270926.csv --output data/catalog.json
      - name: Validate sample scenarios
        run: python scripts/validate_sample_scenarios.py data/samples/scenarios.jsonl --catalog data/catalog.json
      - name: Build sample pack smoke
        run: python scripts/build_pack.py --output /tmp/samples.zip
      - name: Build sample library smoke
        run: python scripts/build_site.py --out /tmp/site-out
