name: Check gallery build

# Gałęzie robocze: budujemy bez deploymentu (deployment wyłącznie z main,
# LESSONS 2026-09-21/22). Osobny workflow, żeby checki PR nie miały wiecznie
# „skipped" joba deploy.

on:
  push:
    branches: ['arena/**']

permissions:
  contents: read

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh catalog
        run: python scripts/import_collection.py kolekcja.csv --output data/catalog.json
      - name: Build gallery
        run: python scripts/build_site.py --out site/generated
      - name: Build pack
        run: python scripts/build_pack.py --output /tmp/pack.zip
