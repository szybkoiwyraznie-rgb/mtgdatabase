name: Check sample library build

on:
  push:
    branches: ['arena/**']

permissions:
  contents: read

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh catalog
        run: python scripts/import_collection.py kolekcja.csv --output data/catalog.json
      - name: Validate scenarios
        run: python scripts/validate_sample_scenarios.py data/samples/scenarios.jsonl --catalog data/catalog.json
      - name: Build sample library
        run: python scripts/build_site.py --out site/generated
      - name: Build sample pack
        run: python scripts/build_pack.py --output /tmp/samples.zip
