name: Import regen artifact (TEMP)

# TEMP (do usunięcia po imporcie): import artefaktu regeneracji r005
# (run 36418807314) — sandbox agenta nie ma dostępu do *.blob.core.windows.net.

on:
  push:
    branches:
      - arena/01a0e78c-mtgdatabase

permissions:
  contents: write
  actions: read

env:
  RUN_ID: "36418807314"
  REGEN_IDS: "23,33,45,51,103,110,156,166,190,221,227,301,331,337,345,375,446,480,489,506,532,570"

jobs:
  import:
    if: contains(github.event.head_commit.message, '[import-regen-r005]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: samples-elevenlabs
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/artifact
      - name: Copy regenerated MP3s and manifest
        run: |
          set -euo pipefail
          unzip -o -q /tmp/artifact/build/samples-latest.zip -d /tmp/mp3s
          IFS=',' read -ra IDS <<< "$REGEN_IDS"
          for id in "${IDS[@]}"; do
            test -s "/tmp/mp3s/${id}.mp3"
            cp "/tmp/mp3s/${id}.mp3" "audio/samples/${id}.mp3"
          done
          cp /tmp/artifact/data/samples/generated-manifest.jsonl data/samples/generated-manifest.jsonl
          echo "copied ${#IDS[@]} files"
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/samples data/samples/generated-manifest.jsonl
          git commit -m "Import sampli regeneracji r005 z artefaktu (run ${RUN_ID})"
          git push origin HEAD:arena/01a0e78c-mtgdatabase
