name: Import regen artifact (TEMP)

# TEMP (do usunięcia po imporcie): import artefaktu regeneracji r004
# (run 36415052620) — sandbox agenta nie ma dostępu do *.blob.core.windows.net.

on:
  push:
    branches:
      - arena/01a0e78c-mtgdatabase

permissions:
  contents: write
  actions: read

env:
  RUN_ID: "36415052620"
  REGEN_IDS: "8,9,28,29,42,46,47,52,55,58,71,74,75,95,107,109,111,114,121,124,140,144,154,168,195,213,223,224,246,251,252,253,275,276,279,292,295,298,305,306,308,309,311,322,330,335,358,367,370,372,374,381,383,386,388,428,442,471,478,481,484,490,513,515,517,523,528,531,537,551,557,560,580,590,593,595,605,616"

jobs:
  import:
    if: contains(github.event.head_commit.message, '[import-regen-r004]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: samples-elevenlabs
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/artifact
      - name: Copy regenerated MP3s and manifest
        run: |
          set -euo pipefail
          unzip -o -q /tmp/artifact/build/samples-latest.zip -d /tmp/mp3s
          IFS=',' read -ra IDS <<< "$REGEN_IDS"
          for id in "${IDS[@]}"; do
            test -s "/tmp/mp3s/${id}.mp3"
            cp "/tmp/mp3s/${id}.mp3" "audio/samples/${id}.mp3"
          done
          cp /tmp/artifact/data/samples/generated-manifest.jsonl data/samples/generated-manifest.jsonl
          echo "copied ${#IDS[@]} files"
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/samples data/samples/generated-manifest.jsonl
          git commit -m "Import sampli regeneracji r004 z artefaktu (run ${RUN_ID})"
          git push origin HEAD:arena/01a0e78c-mtgdatabase
