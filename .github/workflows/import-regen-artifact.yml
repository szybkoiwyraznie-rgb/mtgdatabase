name: Import regen artifact (TEMP)

# TEMP (do usunięcia po imporcie): sandbox agenta nie ma dostępu do
# *.blob.core.windows.net, więc artefakt regeneracji r002 (run 36411895113)
# importuje na branch ten workflow, uruchamiany markerem [import-regen-r002].
# Push przez GITHUB_TOKEN nie wyzwala kolejnych workflow (brak pętli).

on:
  push:
    branches:
      - arena/01a0e78c-mtgdatabase

permissions:
  contents: write
  actions: read

env:
  RUN_ID: "36411895113"
  REGEN_IDS: "76,115,124,150,181,191,243,287,302,303,347,377,461,493,504,511,615"

jobs:
  import:
    if: contains(github.event.head_commit.message, '[import-regen-r002]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: samples-elevenlabs
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/artifact
      - name: Copy regenerated MP3s and manifest
        run: |
          set -euo pipefail
          unzip -o -q /tmp/artifact/build/samples-latest.zip -d /tmp/mp3s
          IFS=',' read -ra IDS <<< "$REGEN_IDS"
          for id in "${IDS[@]}"; do
            test -s "/tmp/mp3s/${id}.mp3"
            cp "/tmp/mp3s/${id}.mp3" "audio/samples/${id}.mp3"
          done
          cp /tmp/artifact/data/samples/generated-manifest.jsonl data/samples/generated-manifest.jsonl
          echo "copied ${#IDS[@]} files"
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/samples data/samples/generated-manifest.jsonl
          git commit -m "Import sampli regeneracji r002 z artefaktu (run ${RUN_ID})"
          git push origin HEAD:arena/01a0e78c-mtgdatabase
