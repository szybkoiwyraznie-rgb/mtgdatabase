name: "TEMP b085 - 666-675 x 3"

on:
  push:
    branches:
      - arena/204cf1cc-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "666,667,668,669,670,671,672,673,674,675"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/204cf1cc-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-b085]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-b085]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-b085] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      # Decyduje o generacji. Trzy przypadki (reguły 29 i 31):
      #   invalid_api_key / api_key_id_used_as_api_key → 400/401 = klucz zły → STOP
      #   missing_permissions / user_read              → klucz dobry, brak odczytu
      #                                                  salda → JEDŹ
      #   saldo < 40                                   → STOP (kredyty)
      - name: Sprawdź klucz i budżet
        id: budget
        if: steps.guard.outputs.run == '1'
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
        run: |
          mkdir -p variants/b085
          python - <<'PY2' 2>&1 | tee -a variants/b085/budget.log | tee /dev/stderr | grep '^ok=' >> "$GITHUB_OUTPUT"
          import json, os, sys, urllib.request, urllib.error
          key = os.environ.get("ELEVENLABS") or ""
          if not key:
              print("BRAK SEKRETU ELEVENLABS"); print("ok=0"); raise SystemExit(0)
          print(f"klucz: dlugosc={len(key)}, prefix={key[:4]!r}")
          if not key.startswith("sk_"):
              print("UWAGA: klucz nie zaczyna sie od 'sk_' — to prawdopodobnie API key ID")
          req = urllib.request.Request("https://api.elevenlabs.io/v1/user/subscription",
                                       headers={"xi-api-key": key})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  d = json.load(resp)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")[:400]
              print(f"HTTP {exc.code}: {body}")
              if "user_read" in body or "missing_permissions" in body:
                  print("klucz dziala, brak tylko odczytu salda -> generuje")
                  print("ok=1"); raise SystemExit(0)
              print("klucz odrzucony -> STOP")
              print("ok=0"); raise SystemExit(0)
          except Exception as exc:
              print(f"blad sieci: {exc} -> generuje ostroznie")
              print("ok=1"); raise SystemExit(0)
          used = d.get("character_count") or 0
          limit = d.get("character_limit") or 0
          left = limit - used
          print(f"character_count={used} character_limit={limit} remaining={left}")
          print(f"ok={1 if left >= 400 else 0}")
          PY2

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1' && steps.budget.outputs.ok == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/b085
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/b085/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --force --retries 2 --prompt-influence 0.35 \
              --out "variants/b085/v$v" 2>&1 | tee -a variants/b085/generate.log
          done

      - name: Podsumowanie plików
        if: always() && steps.guard.outputs.run == '1'
        run: |
          echo "--- wygenerowane pliki ---"
          find variants/b085 -name '*.mp3' 2>/dev/null | sort | while read f; do
            echo "$f $(stat -c%s "$f") B"
          done
          echo "--- razem ---"
          find variants/b085 -name '*.mp3' 2>/dev/null | wc -l

      - name: Commit variants
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/b085 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then echo nic; else
            git commit -m "b085: warianty (666-675 x 3) + log generacji [import-b085]"
            git push origin HEAD:arena/204cf1cc-mtgdatabase
          fi
