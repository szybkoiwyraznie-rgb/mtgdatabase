name: Generate sample batch (ElevenLabs)

# Manual workflow: consumes ElevenLabs quota. It generates MP3s only for
# already hand-written ready scenarios in data/samples/scenarios.jsonl.
# During the b011 bootstrap it can also run from a guarded push commit
# containing [generate-b011]; remove that guarded trigger after the batch
# artifact is imported (the arena bot token cannot use workflow_dispatch).

on:
  push:
    branches:
      - arena/**
  workflow_dispatch:
    inputs:
      collection_csv:
        description: "Collection TSV/CSV path to import before building the library"
        type: string
        default: "fabuły270926.csv"
        required: true
      batch:
        description: "Optional batch label, e.g. b001"
        type: string
        default: ""
        required: false
      ids:
        description: "Optional comma-separated story IDs. Empty = all ready in selected batch."
        type: string
        default: ""
        required: false
      limit:
        description: "Optional first N selected ready scenarios; recommended 10."
        type: string
        default: "10"
        required: false
      force:
        description: "Regenerate files even if already present in the job workspace"
        type: boolean
        default: false
        required: true
      prompt_influence:
        description: "ElevenLabs prompt_influence"
        type: string
        default: "0.35"
        required: true
      publish_pages:
        description: "Deploy generated library to GitHub Pages (main only)"
        type: boolean
        default: false
        required: true

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  OUT_DIR: audio/samples
  MANIFEST: data/samples/generated-manifest.jsonl
  DEFAULT_COLLECTION_CSV: fabuły270926.csv
  DEFAULT_BATCH: b011
  DEFAULT_IDS: 106,107,108,109,110,111,112,113,114,115
  DEFAULT_LIMIT: "10"
  DEFAULT_PROMPT_INFLUENCE: "0.35"
  GENERATED_ARTIFACT_RUN_ID: "pending"

jobs:
  generate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[generate-b011]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve generation inputs
        id: vars
        run: |
          COLLECTION_CSV='${{ inputs.collection_csv }}'
          BATCH='${{ inputs.batch }}'
          IDS='${{ inputs.ids }}'
          LIMIT='${{ inputs.limit }}'
          PROMPT_INFLUENCE='${{ inputs.prompt_influence }}'
          FORCE='${{ inputs.force }}'
          PUBLISH_PAGES='${{ inputs.publish_pages }}'

          if [ -z "$COLLECTION_CSV" ]; then COLLECTION_CSV="$DEFAULT_COLLECTION_CSV"; fi
          if [ -z "$BATCH" ]; then BATCH="$DEFAULT_BATCH"; fi
          if [ -z "$IDS" ]; then IDS="$DEFAULT_IDS"; fi
          if [ -z "$LIMIT" ]; then LIMIT="$DEFAULT_LIMIT"; fi
          if [ -z "$PROMPT_INFLUENCE" ]; then PROMPT_INFLUENCE="$DEFAULT_PROMPT_INFLUENCE"; fi
          if [ -z "$FORCE" ]; then FORCE="false"; fi
          if [ -z "$PUBLISH_PAGES" ]; then PUBLISH_PAGES="false"; fi

          echo "collection_csv=$COLLECTION_CSV" >> "$GITHUB_OUTPUT"
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "prompt_influence=$PROMPT_INFLUENCE" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "publish_pages=$PUBLISH_PAGES" >> "$GITHUB_OUTPUT"

      - name: Refresh catalog from collection
        run: python scripts/import_collection.py "${{ steps.vars.outputs.collection_csv }}" --output data/catalog.json

      - name: Validate scenarios
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Check ElevenLabs configuration
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
        run: test -n "$ELEVENLABS" || { echo "ELEVENLABS secret is empty or unavailable"; exit 1; }

      - name: Generate MP3s with ElevenLabs
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          ARGS=()
          if [ -n "${{ steps.vars.outputs.ids }}" ]; then ARGS+=(--ids "${{ steps.vars.outputs.ids }}"); fi
          if [ -n "${{ steps.vars.outputs.batch }}" ]; then ARGS+=(--batch "${{ steps.vars.outputs.batch }}"); fi
          if [ -n "${{ steps.vars.outputs.limit }}" ]; then ARGS+=(--limit "${{ steps.vars.outputs.limit }}"); fi
          if [ "${{ steps.vars.outputs.force }}" = "true" ]; then ARGS+=(--force); fi
          python scripts/elevenlabs_sample_scout.py \
            --scenarios "$SCENARIOS" \
            --out "$OUT_DIR" \
            --manifest "$MANIFEST" \
            --prompt-influence "${{ steps.vars.outputs.prompt_influence }}" \
            "${ARGS[@]}"

      - name: Build flat ZIP
        run: python scripts/build_pack.py --src "$OUT_DIR" --output build/samples-latest.zip

      - name: Build HTML library
        run: python scripts/build_site.py --out site/generated

      - name: Upload generated ZIP, manifest, MP3s, and HTML library
        uses: actions/upload-artifact@v4
        with:
          name: samples-elevenlabs
          path: |
            build/samples-latest.zip
            data/samples/generated-manifest.jsonl
            audio/samples
            site/generated
          if-no-files-found: error

      - name: Upload Pages artifact
        if: ${{ steps.vars.outputs.publish_pages == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/generated

  import-artifact:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[import-samples-artifact]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download generated batch artifact from previous run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _artifact
          mkdir -p _artifact
          gh run download "$GENERATED_ARTIFACT_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name samples-elevenlabs \
            --dir _artifact
          find _artifact -maxdepth 5 -type f | sort
      - name: Copy artifact outputs into the branch
        run: |
          mkdir -p audio/samples data/samples
          cp _artifact/data/samples/generated-manifest.jsonl data/samples/generated-manifest.jsonl
          cp _artifact/audio/samples/*.mp3 audio/samples/
          ls -lh audio/samples/*.mp3 data/samples/generated-manifest.jsonl
      - name: Commit generated batch outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep derived build/site artifacts out of Git; they are reproducible
          # from audio/samples and the manifest.
          git add audio/samples data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "No generated outputs to commit."
          else
            git commit -m "Import generated b011 samples [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  deploy-pages:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pages && github.ref == 'refs/heads/main' }}
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
