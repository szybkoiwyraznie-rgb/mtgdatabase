name: Generate sample batch (ElevenLabs)

# Manual only: consumes ElevenLabs quota. This workflow generates MP3s only for
# already hand-written ready scenarios in data/samples/scenarios.jsonl.

on:
  # TEMP TRIGGER (do usunięcia po imporcie artefaktu): regeneracja r001 po
  # audycie audio 2026-09-28 — push z markerem [generate-regen-r001] na
  # branchu roboczym. workflow_dispatch jest niedostępny dla tokena bota.
  push:
    branches:
      - arena/01a0e78c-mtgdatabase
  workflow_dispatch:
    inputs:
      collection_csv:
        description: "Collection TSV/CSV path to import before building the library"
        type: string
        default: "fabuły270926.csv"
        required: true
      batch:
        description: "Optional batch label, e.g. b001"
        type: string
        default: ""
        required: false
      ids:
        description: "Optional comma-separated story IDs. Empty = all ready in selected batch."
        type: string
        default: ""
        required: false
      limit:
        description: "Optional first N selected ready scenarios; recommended 10."
        type: string
        default: "10"
        required: false
      force:
        description: "Regenerate files even if already present in the job workspace"
        type: boolean
        default: false
        required: true
      prompt_influence:
        description: "ElevenLabs prompt_influence"
        type: string
        default: "0.35"
        required: true
      publish_pages:
        description: "Deploy generated library to GitHub Pages (main only)"
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  OUT_DIR: audio/samples
  MANIFEST: data/samples/generated-manifest.jsonl
  # TEMP: parametry regeneracji r001 (58 ID z audytu 2026-09-28)
  REGEN_MARKER: "[generate-regen-r001]"
  REGEN_IDS: "76,77,88,93,108,115,124,149,150,159,169,172,181,186,191,200,202,204,213,243,264,281,287,288,301,302,303,306,309,331,346,347,349,352,373,377,388,401,434,435,448,454,461,492,493,494,496,501,504,511,517,542,560,576,582,585,606,615"

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[generate-regen-r001]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh catalog from collection
        run: python scripts/import_collection.py "${{ inputs.collection_csv || 'fabuły270926.csv' }}" --output data/catalog.json

      - name: Validate scenarios
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate MP3s with ElevenLabs
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "push" ]; then
            # TEMP: regeneracja r001 po audycie audio 2026-09-28
            ARGS+=(--ids "$REGEN_IDS" --force)
          else
            if [ -n "${{ inputs.ids }}" ]; then ARGS+=(--ids "${{ inputs.ids }}"); fi
            if [ -n "${{ inputs.batch }}" ]; then ARGS+=(--batch "${{ inputs.batch }}"); fi
            if [ -n "${{ inputs.limit }}" ]; then ARGS+=(--limit "${{ inputs.limit }}"); fi
            if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          fi
          python scripts/elevenlabs_sample_scout.py \
            --scenarios "$SCENARIOS" \
            --out "$OUT_DIR" \
            --manifest "$MANIFEST" \
            --prompt-influence "${{ inputs.prompt_influence || '0.35' }}" \
            "${ARGS[@]}"

      - name: Build flat ZIP
        run: python scripts/build_pack.py --src "$OUT_DIR" --output build/samples-latest.zip

      - name: Build HTML library
        run: python scripts/build_site.py --out site/generated

      - name: Upload generated ZIP, manifest, and HTML library
        uses: actions/upload-artifact@v4
        with:
          name: samples-elevenlabs
          path: |
            build/samples-latest.zip
            data/samples/generated-manifest.jsonl
            site/generated
          if-no-files-found: error

      - name: Upload Pages artifact
        if: ${{ inputs.publish_pages && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/generated

  deploy-pages:
    if: ${{ inputs.publish_pages && github.ref == 'refs/heads/main' }}
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
