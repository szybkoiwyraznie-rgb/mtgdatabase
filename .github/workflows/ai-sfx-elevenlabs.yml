name: Generate AI sound effects (ElevenLabs)

# Manual only: this spends external API quota. It reads the collection CSV,
# creates exactly one prompt per story, generates exactly one MP3 per prompt,
# and uploads a flat ZIP artifact with <id>.mp3 files.

on:
  workflow_dispatch:
    inputs:
      collection_csv:
        description: "Collection TSV/CSV path to import before generating prompts"
        type: string
        default: "kolekcja.csv"
        required: true
      ids:
        description: "Optional comma-separated story IDs, e.g. 1,2,3. Empty = all."
        type: string
        default: ""
        required: false
      limit:
        description: "Optional first N selected stories. Use for paid-api smoke tests."
        type: string
        default: ""
        required: false
      force:
        description: "Regenerate files even if already present in the job workspace"
        type: boolean
        default: false
        required: true
      prompt_influence:
        description: "ElevenLabs prompt_influence"
        type: string
        default: "0.35"
        required: true

permissions:
  contents: read

env:
  PROMPTS: data/ai-sfx/prompts.jsonl
  OUT_DIR: audio/ai-signatures
  MANIFEST: data/ai-sfx/generated-manifest.jsonl

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh catalog from collection
        run: python scripts/import_collection.py "${{ inputs.collection_csv }}" --output data/catalog.json

      - name: Create one prompt per story
        run: |
          ARGS=()
          if [ -n "${{ inputs.ids }}" ]; then ARGS+=(--ids "${{ inputs.ids }}"); fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS+=(--limit "${{ inputs.limit }}"); fi
          python scripts/generate_ai_sound_prompts.py \
            --catalog data/catalog.json \
            --profiles data/semantics/story-profiles.json \
            --out "$PROMPTS" \
            "${ARGS[@]}"

      - name: Generate MP3s with ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.ids }}" ]; then ARGS+=(--ids "${{ inputs.ids }}"); fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS+=(--limit "${{ inputs.limit }}"); fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          python scripts/elevenlabs_soundgen.py \
            --prompts "$PROMPTS" \
            --out "$OUT_DIR" \
            --manifest "$MANIFEST" \
            --prompt-influence "${{ inputs.prompt_influence }}" \
            "${ARGS[@]}"

      - name: Build flat ZIP
        run: python scripts/build_pack.py --src "$OUT_DIR" --output build/ai-signatures-latest.zip

      - name: Upload generated prompts, manifest, and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ai-signatures-elevenlabs
          path: |
            build/ai-signatures-latest.zip
            data/ai-sfx/prompts.jsonl
            data/ai-sfx/generated-manifest.jsonl
          if-no-files-found: error
