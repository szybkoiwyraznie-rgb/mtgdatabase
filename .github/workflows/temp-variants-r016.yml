name: "TEMP r065 - 553, 524 i 67: rzeczowniki zamiast przymiotnikow barwy"

# r065: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
#
# DOBOR — cel ten sam co w r064 (karty 2,0-2,6 s najgorsze w swojej
# klasie), ale kryterium wziete z wniosku r064, nie z luki do mediany:
#
#  553 sword_clash   tresc 2,12 s  luka 0,83 s  1 proba  bez fill-take
#  524 sword_clash   tresc 2,24 s  luka 0,71 s  1 proba  bez fill-take
#   67 war_machine   tresc 2,12 s  luka 1,52 s  3 proba  fill-take od r029
#
# 553 i 524 to profil, ktory juz dwa razy zaprocentowal: JEDNA proba,
# brak fill-take, prompt bez domkniecia — tak wygladaly 247 (+1,94 s)
# i 491 (+0,54 s). 553 ma dodatkowo kontrakt JUZ TERAZ ZLAMANY
# (score 1,0), bo jej prompt opisuje ciecz („steel sliding into a tarry
# basin... one slow drip"), a nie klinge. Nowy prompt moze naprawic
# dlugosc i rozpoznawalnosc naraz.
#
# 67 wraca z najwieksza luka w calym korpusie (1,52 s). Okno
# kontraktowe ma szerokie (centroid <= 2600, mid_up >= 0,1,
# low_all >= 0,35), wiec ryzyko barwowe jest tu mniejsze niz w r064.
#
# NAJWAZNIEJSZE — wniosek z r064, wazy wiecej niz dobor kart:
# MODEL IGNORUJE PRZYMIOTNIKI BARWY I REALIZUJE RZECZOWNIKI.
#   52  dostal „low dull wooden knocks... no bright ticking and no
#       hiss" -> centroid 8309-9512 przy oknie 800-6000, czyli 2,5x
#       za jasno.
#  260  dostal „huge roaring calls" -> centroid 118-166 przy oknie
#       150-1600, czyli za ciemno.
#  491  dostal same rzeczowniki („six plates snapping into place with
#       a firm woody clank") -> kontrakt w calosci, zero flag, +0,54 s.
# Dlatego wszystkie trzy prompty ponizej sa zbudowane WYLACZNIE
# z rzeczownikow i czasownikow: tłok, koła zębate, łańcuch, stal,
# misa, relikwiarz, ostrze, syk. Ani jednego przymiotnika barwy.
#
# ODPOCZYWAJA: 52 i 260 po r064 (oba polegly na barwie), 4, 145, 23,
# 98, 12, 232 — bez zmian.
#
# Take 4,0 s dla wszystkich. Payload 410-440/450 znakow, PL <= 220.
#
# batch w scenarios.jsonl: r065 (MUSI sie zgadzac z --batch).
#
# Po imporcie: postprocess ZAWSZE z --ids ograniczonym do batchu i
# --max-gain-db 26 dla cichych — domyslne 15 dB nie dobija do -20 LUFS,
# gdy wariant wyjdzie bardzo cicho. I ZAWSZE z --out-dir roznym od
# --samples-dir: obrobka w miejscu potrafi pominac czesc plikow (r063).
# Plik i katalog variants/ kasujemy po wyborze wariantow.
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "553,524,67"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r065]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r065]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r065] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r065
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r065/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r065 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r065/v$v" 2>&1 | tee -a variants/r065/generate.log
          done
          ls -la variants/r065 variants/r065/v1 variants/r065/v2 variants/r065/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r065 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r065: 9 wariantow (3 karty x 3) + log generacji [import-r065]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
