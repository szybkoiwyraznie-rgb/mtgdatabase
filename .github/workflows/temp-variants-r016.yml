name: "TEMP r061 - 98, 71 i 5: fill-take, ktorego nigdy nie dostaly"

# r061: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
#
# DOBOR — jedyny wniosek z r060: `583` i `292` urosly o 2,45 i 1,84 s po
# dodaniu klauzuli --fill-take, ktorej nie mialy przez 3-4 poprzednie
# podejscia. Bierzemy trzy kolejne karty, ktore likewise jej nie dostaly:
#
#   98 insect_swarm    tresc 1,82 s  przy medianie 3,91  (bez fill-take)
#   71 heavy_impact    tresc 1,40 s  przy medianie 2,51  (bez fill-take)
#    5 magic_shimmer   tresc 1,87 s  przy medianie 2,69  (bez fill-take)
#
# `98` jest dodatkowo „prawdopodobnie 1,0" (centroid 8860 Hz przy progu
# 1000-6000), wiec moze tylko zyskac. `5` i `71` sa trafione, wiec
# obowiazuje regula 1: spadek werdyktu = powrot do starego.
#
# `12` (robot_servo, luka 2,17 s) omijam: fill-take ma od r055 i nadal
# stoi na 1,80 s, czyli dzwignia jest tam wyczerpana.
#
# PROMPTY NA WZOR PRZECHODZACYCH (dziala od r059):
#   98  przechodzace 574, 166 i 540 mowia o CIAGLYM dronie: „a deep
#       droning buzz with a warm harmonic core, holding steadily without
#       a break". Nasz opisywal ZDARZENIA („dense delicate wing
#       flutters, one confused startled hiss, wings drifting apart"),
#       wiec model robil krotkie trzepotanie zamiast roju.
#   71  wraca po r060, gdzie wszystkie warianty wyszly za ciemne
#       (centroid 51-66 Hz, klasa heavy_impact to 111-2538, wzorce
#       463/328/210 maja 1552/1174/2538). Winny byl moj „low tail".
#       Teraz wstrzasy sa wprost „clearly mid-range".
#    5  wzorzec 96 (2,93 s, ma fill-take): „one continuous flowing
#       shimmering tone with a clear sustained pitch and bright
#       sparkling overtones, smooth and even throughout". Nasz mowil
#       „high in the treble", co ciagnelo centroid w gore (4985).
#
# Take 4,0 s dla wszystkich. Payload 379-418/450 znakow, PL <= 220.
#
# batch w scenarios.jsonl: r061 (MUSI sie zgadzac z --batch).
#
# Po imporcie: postprocess ZAWSZE z --ids ograniczonym do batchu i
# --max-gain-db 26 dla cichych — domyslne 15 dB nie dobija do -20 LUFS,
# gdy wariant wyjdzie bardzo cicho.
# Plik i katalog variants/ kasujemy po wyborze wariantow.
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "98,71,5"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r061]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r061]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r061] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r061
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r061/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r061 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r061/v$v" 2>&1 | tee -a variants/r061/generate.log
          done
          ls -la variants/r061 variants/r061/v1 variants/r061/v2 variants/r061/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r061 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r061: 9 wariantow (3 karty x 3) + log generacji [import-r061]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
