name: "TEMP b074e - 340 Ambulatory Edifice, proba piata"

# b074e: 1 karta x 3 warianty = 3 generacje x 40 kredytow = 120 kredytow.
# To OSTATNIE generacje z budzetu (zostanie 0).
#
# Z siedmiu nowych kart weszlo szesc: 329, 332, 333, 334, 336, 338.
# Zostala tylko 340 Ambulatory Edifice — cztery podejscia, dwanascie
# wariantow, za kazdym razem to samo: tonal_frame_fraction i
# sustain_ratio ponizej progu, centroid 4205-11004.
#
# Ostatnia proba bierze wzorzec wprost z karty 12 (robot_servo,
# trafiony, centroid 4635), jedynej, w ktorej ten archetyp wyszedl
# gladko: „A robot servos engaging: a smooth continuous mechanical
# whirr with a steady hum and a precise click at the end."
# Kluczowe slowa: SMOOTH, CONTINUOUS, STEADY. Poprzednie proby mialy
# „crack", „click each" i „locking out" jako rownorzedne zdarzenia,
# wiec model robil serię trzaskow zamiast ciaglego tonu.

on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "340"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-b074e]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-b074e]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-b074e] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/b074e
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/b074e/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch b074e --force --retries 3 --prompt-influence 0.35 \
              --out "variants/b074e/v$v" 2>&1 | tee -a variants/b074e/generate.log
          done
          ls -la variants/b074e variants/b074e/v1 variants/b074e/v2 variants/b074e/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/b074e data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "b074e: 3 warianty (1 karta x 3) + log generacji [import-b074e]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
