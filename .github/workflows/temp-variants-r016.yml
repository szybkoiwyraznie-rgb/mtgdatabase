name: "TEMP r060 - 583, 292 i 71: klauzula wypelnienia taktu + prompty na wzor przechodzacych"

# r060: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
#
# DOBOR — najgorsze w swojej klasie, czyli najwieksza roznica do mediany
# tresci w archetypie (nie „najkrotsze"):
#
#   583 arrow_flight   tresc 0,21 s  przy medianie 2,34 (2/3 kart >= 2 s)
#   292 wind_gust      tresc 1,38 s  przy medianie 2,71 (5/6 kart >= 2 s)
#    71 heavy_impact   tresc 1,40 s  przy medianie 2,51 (4/5 kart >= 2 s)
#
# `583` to najgorszy sample w korpusie: plik ma 3,30 s, a dzwiek siedzi na
# samym koncu — przed nim 2,9 s ciszy (flaga long_lead_silence). Sama
# tresc to 0,21 s, dziesięciokrotnie mniej niz nastepna karta w kolejce.
#
# GLOWNY LEW: KLAUZULA FILL-TAKE. Tylko `4` z całej siedemnastki miala ja
# dotychczas — `583`, `292` i `71` NIGDY. A to wlasnie ona robila roznice
# w r057 (+2,63 / +2,80 / +2,58 s) i r058 (+2,6…2,8 s we wszystkich 9
# wariantach). `292` probowano juz 4 razy przy take 4,0 s, ale bez tej
# klauzuli; `71` tylko 2 razy i zawsze przy krotkim take 2,5 s
# (regula 6: krotki take sie nie wypelnia).
#
# PROMPTY NA WZOR PRZECHODZACYCH (wniosek z r059, gdzie 434 weszla
# w jednej rundzie po dwoch nieudanych):
#   583  — kontrakt arrow_flight spelniaja dziś karty 207 i 370, czyli
#          w istocie ciecze: szerokopasmowy, ciagly szum. Nasz prompt
#          opisywal KROTKE zdarzenie „twang + swist". Teraz lot jest
#          rozciagniety i konczy sie gluchym trafieniem (karta to
#          „Kill Shot — One perfect arrow", wiec trafienie jest jak
#          najbardziej na miejscu, a nie sztucznym przedluzeniem).
#   292  — przechodzace 9 i 43 mowia „broadband hissing white noise of
#          turbulent air, swelling and easing". Nasz opisywal ZDARZENIA
#          (skrzydlo pergaminu, okiennice, ziarnka kurzu), wiec model
#          robil serie stukniec, a nie podmuch. Stad tez sustain 0,258
#          przy progu 0,3 — podmuch musi byc ciagly, nie poszatkowany.
#    71  — przechodzace 463: „one instant deep weighted impact with no
#          build-up, then two shorter cracking snaps ... within the next
#          second" + fill-take. Nasz mowil o JEDNYM ciosie i ogonie.
#          Dokladamy dwa krotsze wstrzasy po uderzeniu.
#
# Take 4,0 s dla wszystkich. Payload 410-433/450 znakow, PL <= 220.
#
# ZASADA OCHRONNA (regula 1): 583 i 71 sa dzis TRAFIONE 0 pkt, wiec
# spadek werdyktu = powrot do starego. 292 jest „prawdopodobnie 1,0"
# (sustain 0,258 przy progu 0,3) — czyli moze tylko zyskac.
#
# batch w scenarios.jsonl: r060 (MUSI sie zgadzac z --batch).
#
# Po imporcie: postprocess ZAWSZE z --ids ograniczonym do batchu i
# --max-gain-db 26 dla cichych — domyslne 15 dB nie dobija do -20 LUFS,
# gdy wariant wyjdzie bardzo cicho.
# Plik i katalog variants/ kasujemy po wyborze wariantow.
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "583,292,71"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r060]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r060]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r060] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r060
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r060/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r060 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r060/v$v" 2>&1 | tee -a variants/r060/generate.log
          done
          ls -la variants/r060 variants/r060/v1 variants/r060/v2 variants/r060/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r060 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r060: 9 wariantow (3 karty x 3) + log generacji [import-r060]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
