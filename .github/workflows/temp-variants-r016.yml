name: TEMP r025 profile rodzin

# TYMCZASOWY / ZAPARKOWANY: pilot archetypowy.
# 2026-10-05: klucz odnowiony (10 000 kredytów, 40 na generację). Workflow bez
# markera nic nie robi, więc CI pozostaje zielone. Token bota Arena ma HTTP 403 na
# workflow_dispatch, a sandbox nie sięga *.blob.core.windows.net (nie da się
# pobrać logów runa), więc warianty generujemy z triggera push markerowanego
# ([generate-r025]) i commitujemy na gałąź sesji razem z logiem generacji —
# log w repo to jedyny sposób, żeby zobaczyć błąd API z sandboxa.
# Plik i katalog variants/ kasujemy po wyborze wariantów.

on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "276,352,506,580,52,132,213,610,113,204,611,82,453,548,9,43,103,513,23,347,558,37,118,358,74,75,335,303,531,537"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r025]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r025]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r025] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r025
          for v in 1 2; do
            echo "=== wariant v$v ===" | tee -a variants/r025/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r025 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r025/v$v" 2>&1 | tee -a variants/r025/generate.log
          done
          ls -la variants/r025 variants/r025/v1 variants/r025/v2 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r025 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r025: 60 wariantow archetypowych (30 kart x 2) + log generacji [import-r025]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
