name: "TEMP r083 - 209 i 250: 2 x 5"

# r083: 2 karty x 5 wariantow = 10 generacji x 40 kredytow = 400 kredytow.
#
#  209 Burning-Yard Trainer  sword_clash  tresc 2,89 s  0 sasiadow >=0,80
#  250 Loxodon Mender        sword_clash  tresc 2,70 s  0 sasiadow >=0,80
#
# Po r082 (dwie z dwóch): ten sam łańcuch clashing. Obie trafione,
# wolny region, attack_s <= 0,1 wymaga uderzenia w pierwszej chwili.

on:
  push:
    branches:
      - arena/a9d0a113-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "209,250"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/a9d0a113-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r083]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r083]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r083] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 5 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r083
          for v in 1 2 3 4 5; do
            echo "=== wariant v$v ===" | tee -a variants/r083/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r083 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r083/v$v" 2>&1 | tee -a variants/r083/generate.log
          done

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r083 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r083: 10 wariantow (2 karty x 5) + log generacji [import-r083]"
            git push origin HEAD:arena/a9d0a113-mtgdatabase
          fi
