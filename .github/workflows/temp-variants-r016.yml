name: "TEMP r069 - 74, 177 i 308: trojkat uderzenie-rytm-glos"

# r069: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
# Drugi klucz: po tej paczce zostanie 8920.
#
# Trzy karty, trzy rozne osie lancucha zdarzen:
#
#  308 sword_clash      tresc 2,06 s  luka 0,98 s  6 prob  fill-take
#   74 heavy_footsteps  tresc 2,76 s  luka 0,60 s  3 prob  bez fill-take
#  177 creature_roar    tresc 2,38 s  luka 0,77 s  4 prob  fill-take
#
# 308 — oś UDERZENIE. W r068 wszystkie trzy warianty lamaly attack_s
# (1,25-2,40 przy progu <= 0,1): model budowal narastanie. Tym razem
# biorę WZORZEC Z KARTY 334, ktora w b074c weszla od reki z attack
# 0,080: „A scythe striking a metal tree in the first instant: one
# hard crack of the blade, then two long rasping cuts of steel
# through copper, shearing to the end." Prawie slowo w slowo, tylko
# podmienione na wielki miecz. Roznica wzgledem r068: „crack"
# zamiast „impact" i zero trzeciego uderzenia na koncu.
#
# 74 — oś RYTM. heavy_footsteps wymaga ioi_cv <= 0,6, czyli rownych
# odstepow. To ta sama oś, ktora w r067 wprowadzila 52 do korpusu po
# pieciu probach (ioi_cv 2,23 -> 0,795 po dopisaniu „at an even
# spacing"). Obecny sample juz ma ioi_cv 0,431 i tylko dwa
# przejscia, wiec zostaje wydluzyc: osiem krokow, potem cztery.
#
# 177 — oś GŁOS. creature_roar wymaga voiced_fraction >= 0,3 i
# flatness <= 0,15, czyli dzwieku z gardla, nie szumu. Obecny prompt
# to „two short deep bellows with a raspy edge" — „deep" to
# przymiotnik barwy, ktorego od r065 nie uzywamy. Zostaja same
# rzeczowniki: ryk z piersi, trzy razy, kazdy uciety.
#
# Zasady obowiazuja: lancuch na trzech osiach (liczba, material,
# nastepstwo), zero przymiotnikow barwy, rzeczowniki tez niosa barwe,
# domkniecie „to the end".

on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "74,177,308"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r069]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r069]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r069] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r069
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r069/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r069 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r069/v$v" 2>&1 | tee -a variants/r069/generate.log
          done
          ls -la variants/r069 variants/r069/v1 variants/r069/v2 variants/r069/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r069 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r069: 9 wariantow (3 karty x 3) + log generacji [import-r069]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
