name: "TEMP b074d - ostatnie dwie z b074: 329 i 340"

# b074d: 2 karty x 3 warianty = 6 generacji x 40 kredytow = 240 kredytow.
#
# Stan: z 7 nowych kart weszlo szesc —
#   333 Bring to Trial  plate_clank   2,63 s  trafiony
#   336 Zombie Boa      steam_hiss    3,06 s  trafiony
#   332 Blitz Thunder-  thunder_clap  2,29 s  trafiony
#   334 Skyscythe       sword_clash   3,70 s  trafiony  (+ --fix-mono)
#   338 Brine Giant     water_splash  3,06 s  trafiony
#
# Zostaly dwie:
#
#  329 magic_shimmer  b074c v2 jest trafiony (0), ale dostal flagę
#                     long_lead_silence: 1,07 s ciszy na początku,
#                     bo napisałem „swelling from nothing" i model
#                     wziął to dosłownie. --trim-lead-s nie pomaga
#                     (lead zostaje 1,07 s przy każdej wartości).
#                     TERAZ: ton ma brzmieć OD PIERWSZEJ CHWILI
#                     i dopiero narastać.
#  340 robot_servo    trzy podejścia (9 wariantów), za każdym razem
#                     tonal_frame_fraction i sustain_ratio poniżej
#                     progu, centroid 4205-8596. Przyczyna: stawiałem
#                     kliknięcia nóg na równi z tonem serva, więc
#                     szerokopasmowy szum zagłuszał ton.
#                     WZORC Z KARTY 204: „one continuous clean tone at
#                     a constant pitch, dominant and unbroken like a
#                     tuning fork, with just two very soft clicks
#                     barely audible over it". Ton dominuje,
#                     kliknięcia są pod nim.

on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "329,340"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-b074d]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-b074d]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-b074d] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/b074d
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/b074d/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch b074d --force --retries 3 --prompt-influence 0.35 \
              --out "variants/b074d/v$v" 2>&1 | tee -a variants/b074d/generate.log
          done
          ls -la variants/b074d variants/b074d/v1 variants/b074d/v2 variants/b074d/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/b074d data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "b074d: 6 wariantow (2 karty x 3) + log generacji [import-b074d]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
