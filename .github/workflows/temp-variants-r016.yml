name: "TEMP b074 - 7 nowych kart: 329, 332-334, 336, 338, 340"

# b074: 7 kart x 3 warianty = 21 generacji x 40 kredytow = 840 kredytow.
#
# To NIE jest runda naprawcza, tylko paczka nowych kart: numery 329,
# 332, 333, 334, 336, 338 i 340 byly lukami w numeracji — nie mialy
# ani fabuly w fabuly270926.csv, ani wpisu w scenarios.jsonl, ani
# pliku w audio/samples. Fabuly dopisane na koncu CSV (TSV, CRLF),
# katalog przebudowany import_collection.py (570 wpisow).
#
# Dobor archetypow pod to, co w fabule jest pierwszoplanowe:
#
#  329 Blinding Drone      magic_shimmer   snop oślepiającej energii
#  332 Blitz Thunder-Raptor thunder_clap   grzmot po pikowaniu
#  333 Bring to Trial      plate_clank     wrota aresztu i kajdany
#  334 Skyscythe Engulfer  sword_clash     kosa tnie metalowe pnie
#  336 Zombie Boa          steam_hiss      suche łuski i syk
#  338 Brine Giant         water_splash    wynurzenie i druzgotanie pirsów
#  340 Ambulatory Edifice  robot_servo     monument rozkłada stalowe nogi
#
# ZASADY Z r067 OBOWIAZUJA WE WSZYSTKICH SIEDMIU:
#   - łańcuch zdarzeń ma trzy osie: LICZBA, MATERIAŁ, NASTĘPSTWO.
#     Trzeba napisać wszystkie trzy naraz.
#   - ZERO przymiotników barwy (dark/bright/low/deep/metallic/soft).
#   - Rzeczowniki TEŻ niosą barwę: para, gwizd i syk rozjaśniają tak
#     samo jak przymiotnik „bright". Sprawdzać, jakie ZJAWISKO
#     FIZYCZNE niesie dany rzeczownik.
#   - jawne domknięcie „to the end".
#
# Warunki wstępne kontraktów, o które łatwo się potknąć:
#   magic_shimmer  attack_s >= 0,1   — NIE wolno zacząć od uderzenia
#   sword_clash    attack_s <= 0,1   — wręcz przeciwnie, MUSI zacząć
#   water_splash   attack_s <= 0,1   — od chlupnięcia
#   thunder_clap   low_all  >= 0,5   — świst skrzydeł ma być KRÓTKI,
#                                      żeby nie podciągnąć centroidu
#                                      powyżej 800 Hz
#   steam_hiss     high_all >= 0,3   — tu syk jest POŻĄDANY (inaczej
#                                      niż w 501, gdzie zabił low_all)

on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "329,332,333,334,336,338,340"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-b074]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-b074]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-b074] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/b074
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/b074/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch b074 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/b074/v$v" 2>&1 | tee -a variants/b074/generate.log
          done
          ls -la variants/b074 variants/b074/v1 variants/b074/v2 variants/b074/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/b074 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "b074: 21 wariantow (7 kart x 3) + log generacji [import-b074]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
