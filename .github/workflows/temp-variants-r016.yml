name: TEMP b073b - 327 Brave-Kin Duo, przepisany prompt pod sustain_ratio

# b073b: DRUGA PROBA dla 327. 1 karta x 3 warianty = 3 generacje x 40
# kredytow = 120 kredytow (lacznie z b073: 360).
#
# 328 jest DOWIEZIONA (v2, trafiony, 0 flag) i juz lezy w
# audio/samples/328.mp3 — tu jej nie ruszamy.
#
# CO NIE WYSZLO W b073. Wszystkie trzy warianty 327 dostaly
# "prawdopodobnie" i ten sam jeden zarzut:
#
#   sustain_ratio 0,107 / 0,120 / (v3 tez centroid 4998) przy progu >= 0,3
#
# sustain_ratio = ulamek ramek w granicach 12 dB od szczytu
# (audit_semantic_match.py). Pierwszy prompt mowil "korek wyciagniety z
# manierki, ... potem chleptanie" — korek zrobil krotki glosny pik,
# ktory wywindowal szczyt, a cale nalewanie i chleptanie zostalo
# ponizej 12 dB. Dodatkowo trzy ODDZIELNE zdarzenia (korek / lanje /
# chleptanie) z przerwami z definicji nie moga utrzymac poziomu.
#
# NAPRAWA: jedno zdarzenie ciagle. Z promptu wylatuja korek i
# chleptanie, zostaje samo nieprzerwane lanje trzymajace rowny poziom
# przez caly take. Osobny detal ikoniczny: ton nalewania powoli rosnie,
# gdy kubek sie napelnia.
#
# Reszta zalozen bez zmian: pisac o materiale i pasmie, nie o jasnosci;
# nie uzywac "deep"/"dull"; take 3,0 s.
#
# KARTY
#
#   327BLB  Brave-Kin Duo   Bloomburrow. Kroleczy wedrowiec dzieli sie
#                           orzezwiajaca woda z mysim towarzyszem.
#                           archetyp: liquid_pour
#   328LRW  Bog Hoodlums    Lorwyn, moczary Stinkdrank. Dwoch boggartow
#                           z sękatymi maczugami tarauje zbutwiale pnie.
#                           archetyp: heavy_impact
#
# DOBOR ARCHETYPOW
#
#   liquid_pour (3 karty: 218, 293, 502). 218 i 293 to GESTY, CIEMNY
#   szlam i bulgoczacy kociol; 502 to magia. 327 idzie w kontrze:
#   CIENKI, CZYSTY strumien wody — wyzszy, bardziej szumowy, bez gestego
#   bulgotu. Kontrakt: sustain >= 0.3, flatness >= 0.05,
#   centroid 500-4000, content_rel >= 1.5.
#
#   heavy_impact (13 kart). Roznica wobec 366 (groty w TARCZE — suche,
#   twarde drewno) i 561 (ciało w BLOTO): tu dominuje MOKRE,
#   PROCHNIEJACE drewno — kloda nasiaknieta woda, chrzescenie i
#   chlupot. Kontrakt: crest >= 14, attack <= 0.15, decay <= 1.4,
#   low_all >= 0.2.
#
# ZASADY Z b072, ktorych tu pilnujemy
#
#   - Pisac o MATERIAL i PASMIE, nie o jasnosci. W b072 slowo "bright"
#     zamienilo sie w syk (centroid 8072). Dlatego 327 ma "thin clean
#     water ... in the middle of the range", a 328 "wood and wet earth
#     ... the splintering crack clearly in the middle of the range".
#   - Nie pisac "deep" ani "dull": w b072d "deep low body" zrobilo
#     sub-basowy dron (audible_share 0,084). 328 dostaje mase przez
#     "heavy low blow", a nie przez "deep".
#   - Speech zakazane. 328 rezygnuje z "dzikiego chichotu" boggartow
#     na rzecz maczug w butwiejacym pniu — wokal by ryzykowal flage.
#
# Take 3,0 s dla obu (okno wlasiciciela 2-5 s).
#
# batch w scenarios.jsonl: b073 (MUSI sie zgadzac z --batch).
#
# Po imporcie: postprocess ZAWSZE z --ids ograniczonym do batchu i
# --max-gain-db 26 dla cichych — domyslne 15 dB nie dobija do -20 LUFS,
# gdy wariant wyjdzie bardzo cicho.
# Plik i katalog variants/ kasujemy po wyborze wariantow.
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "327"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-b073b]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-b073b]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-b073b] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/b073b
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/b073b/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch b073b --force --retries 3 --prompt-influence 0.35 \
              --out "variants/b073b/v$v" 2>&1 | tee -a variants/b073b/generate.log
          done
          ls -la variants/b073b variants/b073b/v1 variants/b073b/v2 variants/b073b/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/b073b data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "b073: 6 wariantow (2 karty x 3) + log generacji [import-b073b]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
