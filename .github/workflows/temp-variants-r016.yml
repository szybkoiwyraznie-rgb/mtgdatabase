name: "TEMP r063 - 23, 469 i 247: lancuch zdarzen zamiast jednego uderzenia"

# r063: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
#
# DOBOR — lekcja z r062. Tam fill-take dostaly trzy karty, a zadzialala
# tylko jedna: `71` (+0,90 s, centroid 268 -> 1157 Hz). `4` i `145`
# wyszly gorzej, choc tez dostaly klauzule. Roznica byla w srodku
# promptu, nie w klauzuli:
#
#   71  „one instant deep impact, then his armour plates clattering and
#       the barrier cracking with sharp splintering snaps" — LANCUCH
#       odrebnych zdarzen.
#   4   „five bodies slam into a pool one after another" — powtorzenie
#       tego samego, model robil piec szybkich pluskow i ucinal.
#
# Wiec bierzemy trzy karty, w których ciag zdarzen jest naturalny
# i żadna nie dostala jeszcze fill-take:
#
#   23 temple_bell       tresc 1,72 s  mediana klasy 2,62  najlepsza 3,71
#  469 chain_rattle      tresc 1,99 s  mediana klasy 2,69  najlepsza 3,39
#  247 heavy_footsteps   tresc 2,06 s  mediana klasy 3,27  najlepsza 3,74
#
# Wszystkie trzy maja kontrakt SPELNIONY W CALOSCI (score 0), wiec
# obowiazuje regula 1 w najostrzejszej postaci: wariant lamiacy
# kontrakt odpada nawet przy duzym przyroscie tresci — tak polegla
# `145` w r062 (1,68 s tresci, ale centroid 5990 przy progu 600-4500).
#
# CO ZMIENIAMY W PROMPTACH:
#   23  bylo „struck once" — jednym uderzeniem nie da sie wypelnic
#       4 s. Teraz trzy uderzenia, ostatnie wybrzmiewa do konca.
#  469  wzor `522` (najlepsza w klasie, 3,39 s) mowi wprost: „at least
#       ten separate metallic ticks across the whole take". Bierzemy
#       to samo: dziesiec osobnych stukow, powtarzane skoki.
#  247  najmniej wyeksploatowana karta w puli — tylko 1 proba. Stary
#       prompt konczyl sie slowami „then stopping", czyli sam kazal
#       modelowi skonczyc. Teraz: „keeping on without a break to the
#       end".
#
# ODPOCZYWAJA:
#    4 water_splash  (9 prob) i 145 beast_scroll (5) — po r062, gdzie
#       zaden z szesciu wariantow nie przebil stanu obecnego.
#   98 insect_swarm — kontrakt wymaga dronu, karta daje trzepotanie.
#   232 plate_clank — odlozona po trzech nieudanych rundach.
#
# Take 4,0 s dla wszystkich. Payload 431-445/450 znakow, PL <= 220.
#
# batch w scenarios.jsonl: r063 (MUSI sie zgadzac z --batch).
#
# Po imporcie: postprocess ZAWSZE z --ids ograniczonym do batchu i
# --max-gain-db 26 dla cichych — domyslne 15 dB nie dobija do -20 LUFS,
# gdy wariant wyjdzie bardzo cicho.
# Plik i katalog variants/ kasujemy po wyborze wariantow.
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "23,469,247"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r063]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r063]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r063] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r063
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r063/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r063 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r063/v$v" 2>&1 | tee -a variants/r063/generate.log
          done
          ls -la variants/r063 variants/r063/v1 variants/r063/v2 variants/r063/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r063 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r063: 9 wariantow (3 karty x 3) + log generacji [import-r063]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
