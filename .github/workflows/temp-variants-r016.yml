name: TEMP r018 transza naprawcza

# TYMCZASOWY / ZAPARKOWANY: pilot archetypowy.
# 2026-10-05: klucz odnowiony (10 000 kredytów, 40 na generację). Workflow bez
# markera nic nie robi, więc CI pozostaje zielone. Token bota Arena ma HTTP 403 na
# workflow_dispatch, a sandbox nie sięga *.blob.core.windows.net (nie da się
# pobrać logów runa), więc warianty generujemy z triggera push markerowanego
# ([generate-r018]) i commitujemy na gałąź sesji razem z logiem generacji —
# log w repo to jedyny sposób, żeby zobaczyć błąd API z sandboxa.
# Plik i katalog variants/ kasujemy po wyborze wariantów.

on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "1,2,3,4,5,6,7,9,12,23,31,42,45,49,58,67,81,92,95,103,112,113,120,124,128,157,168,172,177,187,202,204,209,214,223,228,251,262,265,298,303,308,317,343,347,358,382,383,431,444,456,459,468,482,493,495,496,513,515,521,531,532,534,537,558,562,571,574,583,607,610,611,164,192,260"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r018]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r018]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r018] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r018
          for v in 1 2; do
            echo "=== wariant v$v ===" | tee -a variants/r018/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r018 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r018/v$v" 2>&1 | tee -a variants/r018/generate.log
          done
          ls -la variants/r018 variants/r018/v1 variants/r018/v2 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add variants data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r016b: warianty archetypowe (387, 464, 539) + log generacji [import-r018]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
