name: TEMP r057 - osiem krotkich kart, latka na konkretna metryke

# r057: osiem kart z trescia ponizej 2 s. 8 kart x 2 warianty = 16
# generacji x 40 kredytow = 640 kredytow.
#
# PUNKT WYJSCIA. Po r056 korpus ma 21 kart z `content_s` < 2 s (miara
# z STATE.md: czas pliku minus cisza na krawedziach, prog -45 dBFS).
# Wszystkie 21 dostalo juz przynajmniej jedna probe; r056 wziela osiem
# „swiezych" i ZADNA nie weszla (0/8). Dzis nietknieta wspolczesna
# technika zostala tylko `23` (ostatni prompt z r028).
#
# DOBOR — nie najkrotsze, ale te z NAJKONKRETNIEJSZA DIAGNOZA. Kazda
# latka celuje w jedna metryke, ktora w poprzedniej probie nie dowiozla:
#
#   232 plate_clank     r056: onset_count 0 + flatness 0,018 (za tonalne)
#                       -> „six separate ... with clear silence between
#                          them" + „dry and unpitched" (flatness >= 0,03)
#   434 war_machine     r055: v2 spelnil widmo, ale onset_count 0
#                       -> „each one landing separately with a short
#                          pause between them"
#   113 robot_servo     r055: v1 czysty ton 11 kHz, v2 sub-bas 135 Hz,
#                       oba bez onsetow -> ton + „two sharp clicks spaced
#                          far apart" (tonal >= 0,35 i onset >= 2 naraz)
#   269 beast_screech   r056: attack_s 0,820 (prog <= 0,15)
#                       -> fraza wyprobowana na 344 w r055 (2,020 -> 0,1):
#                          „by far the loudest moment of the whole take"
#     4 water_splash    r056: attack_s 0,670 (prog <= 0,1) -> ta sama latka
#    26 stone_slide     r056: decay_s 0,060 (prog >= 0,5) -> „holds the
#                          same loud rumbling level" zamiast piku i zaniku
#   558 temple_bell     r056: centroid 3095 przy limicie 3000
#                       -> „low, dark bronze ... well below the middle
#                          of the range"
#    23 temple_bell     swieza (prompt z r028) -> wypelnienie take'u;
#                          celowo INACZEJ niz 558 (zelazo, srodek pasma),
#                          zeby nie powstala para — 558 i 23 nie sa dziś
#                          w zadnej parze i tak musi zostac.
#
# Take 4,0 s dla wszystkich (regula 6: krotki take sie nie wypelnia —
# w r056 grupa 2,5 s dostala 8-83 % wypelnienia, grupa 4,0 s: 31-85 %).
#
# ZASADA OCHRONNA (regula 1): wszystkie osiem kart jest dziś TRAFIONYCH.
# Spadek werdyktu = powrot do starego sample, nawet jesli tresc urosnie.
# Odrzucamy tez przyrost < 0,3 s, jesli cena jest nowa flaga (regula 2).
#
# batch w scenarios.jsonl: r057 (MUSI sie zgadzac z --batch).
#
# Po imporcie: postprocess ZAWSZE z --ids ograniczonym do batchu i
# --max-gain-db 26 dla cichych — domyslne 15 dB nie dobija do -20 LUFS,
# gdy wariant wyjdzie bardzo cicho.
# Plik i katalog variants/ kasujemy po wyborze wariantow.
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "232,434,113,269,4,26,558,23"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r057]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r057]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r057] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r057
          for v in 1 2; do
            echo "=== wariant v$v ===" | tee -a variants/r057/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r057 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r057/v$v" 2>&1 | tee -a variants/r057/generate.log
          done
          ls -la variants/r057 variants/r057/v1 variants/r057/v2 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r057 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r057: 16 wariantow (8 kart x 2) + log generacji [import-r057]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
