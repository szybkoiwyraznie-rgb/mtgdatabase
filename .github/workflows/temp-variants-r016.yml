name: "TEMP r062 - 4, 145 i 71: fill-take tam, gdzie jeszcze go nie bylo"

# r062: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
#
# DOBOR — z 14 kart ponizej 2 s treści bierzemy trzy, w ktorych jest
# realna luka i ktore nie sa spalone:
#
#    4 water_splash    tresc 1,14 s  klasa 4 karty, mediana 2,37
#   71 heavy_impact    tresc 1,40 s  klasa 5 kart, mediana 2,51
#  145 beast_screech   tresc 1,52 s  klasa 3 karty, mediana 1,84
#
# `4` dostala fill-take w r057 i urosla o 0,69 s (z 0,45), wiec klauzula
# dziala — ale samo „trzy ciala wpadaja" dalo tylko 1,14 s. Teraz jest
# ich piec i sa rozlozone rownomiernie, a woda chlupie do samego konca.
#
# `145` i `71` dostaja fill-take po raz pierwszy. `145` i tak miala juz
# „trzy metaliczne huki", teraz dochodzi lancuch: wiecej uszczelek,
# wlazy, chlupanie plynu.
#
# `71` to trzecia i ostatnia proba. r060 i r061 razem daly centroid
# 48-66 Hz i mid_up 0,008-0,038, czyli ponad 99% energii ponizej 250 Hz
# — na telefonie nieslyszalne, gorzej niz najgorsza karta w klasie
# (156: mid_up 0,041). Przymiotnik „clearly mid-range" nie ruszyl
# centroidu ani o 10 Hz, bo semantyka („głuche, gumowate uderzenie")
# ciagnie model w sam dol. Wiec zamiast opisywac BARWE wprowadzamy
# ZRODLO srodka pasma: pancerz nosorozca i pekajaca bariera.
#
# ODPOCZYWAJA:
#   98 insect_swarm — w r061 wszystkie trzy warianty wypadly na
#      „nie trafiony" (sustain 0,020-0,075 przy progu 0,4). Karta
#      daje trzepotanie, kontrakt wymaga dronu. Nie ma sensu dalej.
#   12 robot_servo (luka 0,20 s) i 469 chain_rattle (0,01 s) —
#      ponizej progu oplacalnosci.
#   232 plate_clank — odlozona po trzech nieudanych rundach.
#
# Take 4,0 s dla wszystkich. Payload 438-444/450 znakow, PL <= 220.
#
# batch w scenarios.jsonl: r062 (MUSI sie zgadzac z --batch).
#
# Po imporcie: postprocess ZAWSZE z --ids ograniczonym do batchu i
# --max-gain-db 26 dla cichych — domyslne 15 dB nie dobija do -20 LUFS,
# gdy wariant wyjdzie bardzo cicho.
# Plik i katalog variants/ kasujemy po wyborze wariantow.
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "4,145,71"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r062]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r062]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r062] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r062
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r062/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r062 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r062/v$v" 2>&1 | tee -a variants/r062/generate.log
          done
          ls -la variants/r062 variants/r062/v1 variants/r062/v2 variants/r062/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r062 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r062: 9 wariantow (3 karty x 3) + log generacji [import-r062]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
