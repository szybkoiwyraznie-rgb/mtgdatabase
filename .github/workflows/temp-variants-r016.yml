name: "TEMP r084 - 277 i 576: 2 x 5"

# r084: 2 karty x 5 wariantow = 10 generacji x 40 kredytow = 400 kredytow.
# 277 Spinewoods Paladin sword_clash 3,04 s  0 sasiadow >=0,80
# 576 Akroan Sergeant    sword_clash 3,00 s  0 sasiadow >=0,80

on:
  push:
    branches:
      - arena/a9d0a113-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "277,576"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/a9d0a113-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r084]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r084]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r084] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 5 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r084
          for v in 1 2 3 4 5; do
            echo "=== wariant v$v ===" | tee -a variants/r084/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r084 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r084/v$v" 2>&1 | tee -a variants/r084/generate.log
          done

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r084 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r084: 10 wariantow (2 karty x 5) + log generacji [import-r084]"
            git push origin HEAD:arena/a9d0a113-mtgdatabase
          fi
