name: TEMP r058 - trzy najgorsze karty swoich klas, latka na jedna metryke

# r058: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
#
# DOBOR — nie „najkrotsze", ale NAJGORSZE W SWOIM ARCHETYPIE. Kazda z
# trzech jest dzis najslabsza karta swojej klasy pod wzgledem tresci,
# a mediana klasy lezy wysoko, wiec zapas jest duzy:
#
#   232 plate_clank     tresc 0,98 s  przy medianie klasy 2,97 (18/19 >= 2 s)
#   434 war_machine     tresc 1,20 s  przy medianie klasy 3,06 (5/6 >= 2 s)
#   113 robot_servo     tresc 1,24 s  przy medianie klasy 3,97 (4/6 >= 2 s)
#
# DLACZEGO NIE 269 I 23 (też odrzucone w r057):
#
#   269 beast_screech   tresc 1,84 s = MEDIANA klasy (1/3 kart >= 2 s).
#                       2 s jest dla tego archetypu nietypowe, a latka
#                       na attack_s polegla tu dwukrotnie (1,06 i 0,60
#                       przy progu 0,15) — choć ta sama fraza dowiozla
#                       344 w r055 (2,020 -> <= 0,1) i 4 w r057.
#                       Przyrost do progu to tylko +0,16 s, ponizej
#                       progu oplacalnosci z reguly 2.
#    23 temple_bell     tresc 1,72 s, brakuje 0,28 s — tez ponizej
#                       reguly 2. Dwa podejscia w r057 SKROCILY ja
#                       (-0,75 i -0,82), wiec trzecie jest ryzykowne.
#
# CO POLEGLO W r057 I JEST NAPRAWIANE. Wazne: dlugosc juz wyszla
# (+2,63 / +2,80 / +2,58 s). Polegly konkretne metryki kontraktu:
#
#   232 plate_clank     crest 15,3 (prog >= 17) i flatness 0,0098
#                       (prog >= 0,03). Korpus: crest mediana 23,1
#                       (min 19,9), flatness mediana 0,079.
#                       -> „dull steel clanks" zrobilo miekkie i
#                          tonalne uderzenia. Teraz: „hard", „sharp hit",
#                          „gritty unpitched scrape", „no ringing tone".
#   434 war_machine     mid_up 0,028 (prog >= 0,1) — model zrobil sam dol.
#                       Korpus: mid_up mediana 0,857 (min 0,285).
#                       -> zgrzyt idzie PIERWSZY i z deklaracja pasma,
#                          dudnienie tylko „underneath". Bez „deep"
#                          (w b072d zrobilo sub-basowy dron).
#   113 robot_servo     sustain 0,005 / 0,033 (prog >= 0,2). Korpus:
#                       0,990 i 0,995, czyli tony ciagle.
#                       -> w r057 peakiem zostaly „two sharp clicks".
#                          Teraz hum jest najglosniejszy i trzyma rowny
#                          poziom, a klikniecia sa „far quieter than
#                          the hum" (sustain = ulamek ramek w granicach
#                          12 dB od szczytu).
#
# Take 4,0 s dla wszystkich (regula 6: krotki take sie nie wypelnia).
#
# ZASADA OCHRONNA (regula 1): wszystkie trzy karty sa dzis TRAFIONE.
# Spadek werdyktu = powrot do starego sample, nawet jesli tresc urosnie.
# Odrzucamy tez przyrost < 0,3 s, jesli cena jest nowa flaga (regula 2).
#
# batch w scenarios.jsonl: r058 (MUSI sie zgadzac z --batch).
#
# Po imporcie: postprocess ZAWSZE z --ids ograniczonym do batchu i
# --max-gain-db 26 dla cichych — domyslne 15 dB nie dobija do -20 LUFS,
# gdy wariant wyjdzie bardzo cicho.
# Plik i katalog variants/ kasujemy po wyborze wariantow.
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "232,434,113"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r058]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r058]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r058] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r058
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r058/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r058 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r058/v$v" 2>&1 | tee -a variants/r058/generate.log
          done
          ls -la variants/r058 variants/r058/v1 variants/r058/v2 variants/r058/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r058 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r058: 9 wariantow (3 karty x 3) + log generacji [import-r058]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
