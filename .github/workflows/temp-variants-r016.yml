name: "TEMP r068 - 501, 565 i 308: trzy znane przyczyny pudla"

# r068: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
#
# DOBOR — trzy karty z najwiekszymi lukami, kazda z inna, juz ZNANA
# przyczyna porazki:
#
#  501 war_machine      tresc 2,75 s  luka 1,19 s  4 prob  fill-take od r029
#  565 forest_birdsong  tresc 2,67 s  luka 1,02 s  4 prob  fill-take od r054
#  308 sword_clash      tresc 2,06 s  luka 0,96 s  4 prob  fill-take
#
# 501 wraca po jednym pudle, ktorego przyczyna jest znana CO DO SLOWA.
# W r067 wrzucilem „a valve opening with steam venting" i para zmienila
# machine w czajnik:
#
#   low_all   v1 0,022   v2 0,131   v3 0,131      prog >= 0,35
#   mid_up    v1 0,978   v2 0,869   v3 0,870      (prawie cala energia w gorze)
#
# Obecny sample 501 ma low_all 0,725 i centroid 459 — wzorzec jest
# w korpusie, wiec wystarczy NIE popsuc. Wylatuje para, zostaja same
# niskie czesci: tlok, korbowod, kolo zamachowe, lancuch.
#
# 565 ma juz lancuch („eight clear piping chirps in an uneven rhythm"),
# ale konczy sie przymiotnikiem („each a short bright tonal whistle")
# i nie ma domkniecia. forest_birdsong i tak wymaga onset_count >= 4,
# wiec lancuch jest tu naturalny.
#
# 308 to sword_clash, archetyp z najostrzejszym warunkiem wstepnym:
# attack_s <= 0,1, czyli uderzenie w pierwszej chwili (to samo wylozylo
# 524 w r065). Obecny sample spelnia go z zapasem (0,03), wiec lancuch
# MUSI zaczac sie od uderzenia, a narastanie dopiero po nim.
#
# ZASADA OBOWIAZUJE WE WSZYSTKICH TRZECH:
#   ZERO przymiotnikow barwy (dark/bright/low/deep/metallic/soft).
#   Tylko rzeczowniki (co uderza) i czasowniki (co robi),
#   plus jawne domkniecie „to the end".
#
# NOWE od r067: rzeczowniki TEZ niosa barwe. Para, gwizd, syk i brzek
# szkla rozjasniaja tak samo jak przymiotnik „bright". Sprawdzac, jakie
# ZJAWISKO FIZYCZNE niesie dany rzeczownik, nie tylko czy to rzeczownik.

on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "501,565,308"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r068]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r068]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r068] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r068
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r068/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r068 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r068/v$v" 2>&1 | tee -a variants/r068/generate.log
          done
          ls -la variants/r068 variants/r068/v1 variants/r068/v2 variants/r068/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r068 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r068: 9 wariantow (3 karty x 3) + log generacji [import-r068]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
