name: "TEMP b074b - 5 powtorek z b074: 329, 332, 334, 338, 340"

# b074b: 5 kart x 3 warianty = 15 generacji x 40 kredytow = 600 kredytow.
#
# Z pierwszej paczki b074 (7 nowych kart) weszly dwie:
#   333 Bring to Trial   plate_clank   v1  2,63 s  trafiony (0)
#   336 Zombie Boa       steam_hiss    v3  3,06 s  trafiony (0)
#
# Piec pozostalych dostaje nowe prompty, bo kazda polegla z INNEJ,
# znanej przyczyny:
#
#  329 magic_shimmer  centroid 610/274/120 — wszystkie ZA CIEMNE na
#                     high_all >= 0,4. Wina mojego promptu: napisalem
#                     „a low hum", czyli wpuscilem przymiotnik barwy
#                     tylnymi drzwiami. Teraz: „a rising whine of
#                     stone" i „a glassy shimmer".
#  332 thunder_clap   v1/v3 centroid 1650/1764 (prog <= 800) — swist
#                     skrzydel za dlugi. v2 lamie decay_s. Teraz swist
#                     krotszy, a grzmot ma wyraznie wybrzmiewac.
#                     332 BEZ --fill-take, bo kontrakt wymaga decay_s
#                     >= 0,5, czyli wybrzmienia przed koncem.
#  334 sword_clash    attack_s 0,88-2,82 przy progu <= 0,1 — model
#                     budowal narastanie zamiast zaczac od uderzenia.
#                     Teraz uderzenie jest w pierwszym slowie zdarzenia.
#  338 water_splash   v2 Trafiony, ale dwie pary: 0,9248 z 495 i
#                     0,9045 z 160. Zmieniony material, zeby zabrzmiec
#                     inaczej: nie woda sama, tylko woda + walace sie
#                     glazy pirsu + gruz wpadajacy do wody.
#  340 robot_servo    tonal_frame_fraction i sustain_ratio — bazaltowy
#                     trzask to szerokopasmowy szum i zagluszyl servo.
#                     Teraz servo na pierwszym planie, trzask tylko
#                     zaznaczony.

on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "329,332,334,338,340"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-b074b]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-b074b]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-b074b] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/b074b
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/b074b/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch b074b --force --retries 3 --prompt-influence 0.35 \
              --out "variants/b074b/v$v" 2>&1 | tee -a variants/b074b/generate.log
          done
          ls -la variants/b074b variants/b074b/v1 variants/b074b/v2 variants/b074b/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/b074b data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "b074b: 15 wariantow (5 kart x 3) + log generacji [import-b074b]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
