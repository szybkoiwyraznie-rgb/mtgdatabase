name: "TEMP r067 - 52, 501 i 355: dwa archetypy, ktore dzialaja"

# r067: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
#
# DOBOR — dwie karty z najwiekszymi lukami i jedna z najlepszego archetypu:
#
#   52 mechanism_click  tresc 2,20 s  luka 1,22 s  5 prob  bez fill-take
#  501 war_machine      tresc 2,75 s  luka 1,19 s  3 prob  fill-take od r029
#  355 plate_clank      tresc 2,01 s  luka 0,99 s  2 prob  fill-take od r028
#
# 501 to TEN SAM archetyp, w ktorym rzeczowniki DZIALAJA: r065 dala
# 67 +1,84 s („piston, gears, chain, sprocket") i 553 +1,02 s („steel
# drawn against steel, blade lifted out of a basin"). Obecny prompt 501
# jest jeszcze przymiotnikowy („two heavy blasts with a low thump,
# over loud gritty metallic knocking... carried clearly in the middle
# of the range"). Dostanie sam mechanizm: cylinder, zawor, pompa,
# korbowod — bez zadnego przymiotnika barwy.
#
# 52 wraca PO RAZ TRZECI i diagnoza jest juz waska. W r064 polegla na
# barwie (centroid 8309-9512). W r066 rzeczowniki BARWE NAPRAWILY:
# v1 5936 i v3 5392 sa w oknie 800-6000. Ale wszystkie trzy zlamaly
# ioi_cv, czyli ROWNOSC RYTMU:
#
#   ioi_cv   v1 2,231   v2 1,370   v3 1,327     prog <= 0,8
#
# Obecny sample ma ioi_cv 0,252 — wzorzec jest w korpusie, moj prompt
# po prostu o rowny odstep nie zadal. Zostal JEDEN warunek.
#
# 355 lezy w plate_clank, archetypie ktory odpowiedzial na lancuch
# zdarzen trzy razy z rzedu: 491 w r064 (+0,54 s), 445 w r066 (+1,47 s,
# a wszystkie trzy warianty przeszly kontrakt). Prompt 355 ma juz
# lancuch („five separate steel plates clanking one after another"),
# ale konczy sie przymiotnikiem „distinct and mid-pitched" bez
# domkniecia.
#
# 372 ODPOCZYWA. Jej v2 (2,90 s, zero flag, trafiony 0) dobrala pare
# 0,9212 z karta 97 — wiecej niz warta 0,65 s zysku. v3 zlamal low_all
# o 0,001.
#
# ZASADA OBOWIAZUJE WE WSZYSTKICH TRZECH:
#   ZERO przymiotnikow barwy (dark/bright/low/deep/metallic/soft).
#   Tylko rzeczowniki (co uderza) i czasowniki (co robi),
#   plus jawne domkniecie „to the end".
#
# W r067 dodatkowo, po raz pierwszy: rowny odstep miedzy zdarzeniami
# musi byc wprost w zgloszeniu, nie tylko ich liczba.

on:
  push:
    paths:
      - 'scripts/**'
      - 'data/samples/**'
      - 'audio/samples/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      IDS: "52,501,355"
    steps:
      - name: Guard — tylko commit z markerem [generate-r067]
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r067]'; then
            echo "commit zawiera [generate-r067] — generuję"
          else
            echo "brak markera [generate-r067] — nic nie generuję"
            exit 0
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Zależności
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy soundfile pyloudnorm pyyaml
      - name: Walidacja przed generowaniem
        run: |
          python scripts/validate_sample_scenarios.py
      - name: Trzy warianty na kartę
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS }}
        run: |
          mkdir -p variants/r067
          : > variants/r067/generate.log
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r067/generate.log
            python scripts/generate_samples.py \
              --ids "$IDS" --batch r067 --force --retries 3 --prompt-influence 0.35 \
              --out-dir "variants/r067/v$v" 2>&1 | tee -a variants/r067/generate.log
          done
      - name: Commit wariantów
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add variants/r067 || true
          if git diff --cached --quiet; then
            echo "brak nowych wariantów do zapisania"
          else
            git commit -m "[import-r067] warianty z runs: wczesniej wygenerowane"
            git push
          fi
