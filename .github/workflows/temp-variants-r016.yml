name: "TEMP r080 - 140 i 370: druga transza 2 x 5"

# r080: 2 karty x 5 wariantow = 10 generacji x 40 kredytow = 400 kredytow.
# Po tej paczce na drugim kluczu zostanie 4880.
#
#  140 plate_clank   tresc 2,70 s  luka 0,48 s  3 prob  0 sasiadow >=0,80
#  370 arrow_flight  tresc 2,34 s  luka 0,32 s  1 prob  0 sasiadow >=0,80
#
# Druga transza w formacie 2 x 5. r079 nie rozstrzygla, czy piec
# wariantow na karte jest lepsze niz trzy (1 z 2 miesci sie w
# dotychczasowym rozrzucie), ale pokazala, NA CO warto wydac
# proby: na karty, ktorych rozklad dlugosci OBEJMUJE wartosc
# docelowa. 333 mial rozklad 0,48-2,84 s i dala sie wyciagnac;
# 534 miala 0,57-1,86 s i nie dala sie, mimo pieciu prob.
#
#  140  proba 4. Poprzednie: r077 z tym samym tekstem dala
#       2,22 / 2,42 / 2,37 s, wszystkie krotsze od obecnych 2,70.
#       Dostaje piec prob z tym samym promptem — czysty test,
#       czy dochodzenie nastepuje przez liczbe prob, czy nie.
#
#  370  proba 2. Pierwsza proba (b031) dala 2,34 s. Dostaje
#       lancuch czterech zgrzytow cieczy, ale UTRZYMUJE material
#       z obecnego promptu: to zasysanie, nie strzaly.
#       arrow_flight wymaga decay_s <= 0,8, wiec konczymy na
#       zdarzeniu („the pulling to the end"), nie na wybrzmieniu.
#       Zmiana materialu na strzaly poprawilaby klasyfikator, ale
#       popsulaby zwiazek dzwieku z karta (Consume Spirit) —
#       a to jest glowny zarzut wlasciciela.
#
# Obie karty: region wolny (0 sasiadow >= 0,80 i >= 0,85),
# kontrakt z krotkim zanikiem (plate_clank <= 1,2,
# arrow_flight <= 0,8).
#
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "140,370"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r080]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r080]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r080] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 5 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r080
          for v in 1 2 3 4 5; do
            echo "=== wariant v$v ===" | tee -a variants/r080/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r080 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r080/v$v" 2>&1 | tee -a variants/r080/generate.log
          done
          ls -la variants/r080 variants/r080/v1 variants/r080/v2 variants/r080/v3 variants/r080/v4 variants/r080/v5 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r080 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r080: 9 wariantow (3 karty x 3) + log generacji [import-r080]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
