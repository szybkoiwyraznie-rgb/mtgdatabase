name: "TEMP r066 - 52, 372 i 445: rzeczowniki, tak jak w r065"

# r066: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
#
# DOBOR — jedna powtorka i dwie swieze karty:
#
#   52 mechanism_click  tresc 2,20 s  luka 1,22 s  4 prob  bez fill-take
#  372 stone_slide      tresc 2,25 s  luka 0,61 s  1 proba  bez fill-take
#  445 plate_clank      tresc 2,27 s  luka 0,70 s  4 prob  bez fill-take
#
# 52 wraca CELOWO. W r064 polegla na barwie (centroid 8309-9512 przy
# oknie 800-6000), a jej prompt byl samymi przymiotnikami („low dull
# wooden... deep and soft-edged... no bright ticking"). To najwieksza
# luka w korpusie i najprostszy sprawdzian wniosku z r065. Dostaje
# wylacznie rzeczowniki: drewniany kolęk, mosiezne kolo zebate,
# dzwignia, zapadka.
#
# 372 ma tylko JEDNA probe i prompt bez domkniecia („One deep grinding
# scrape... slow, heavy and resonant") — profil, ktory dal juz
# 247 (+1,94 s), 491 (+0,54 s) i 553 (+1,02 s).
#
# 445 jest w plate_clank, czyli w archetypie, ktory w r064 zadzialal
# najczysciej (491). Jej prompt ma juz lancuch („four clear hoof
# crunches"), ale bez domkniecia i z przymiotnikiem „clear".
#
# ZASADA Z r065 OBOWIAZUJE WE WSZYSTKICH TRZECH: zero przymiotnikow
# barwy, tylko rzeczowniki i czasowniki. r065 potwierdzila hipoteze z
# r064 — 67 z rzeczownikami dala +1,84 s i czysty kontrakt, podczas
# gdy 52 i 260 z przymiotnikami polegly na barwie w przeciwnych
# kierunkach (za jasno / za ciemno).
#
# UWAGA NA LIMITY: payload <= 450 zn. (scout dokleja 32 zn. zakazow),
# a polski sample_scenario <= 220 zn. Oba sprawdza
# validate_sample_scenarios.py przed generacja.
#
# ODPOCZYWAJA: 524 (attack_s jest binarny — prompt musi zaczynac sie
# od uderzenia), 4, 145, 23, 98, 12, 232, 260 — bez zmian.
#
# Take 4,0 s dla wszystkich. Payload 423-447/450 znakow.
#
# batch w scenarios.jsonl: r066 (MUSI sie zgadzac z --batch).
#
# Po imporcie: postprocess ZAWSZE z --ids ograniczonym do batchu i
# --max-gain-db 26 dla cichych — domyslne 15 dB nie dobija do -20 LUFS,
# gdy wariant wyjdzie bardzo cicho. I ZAWSZE z --out-dir roznym od
# --samples-dir: obrobka w miejscu potrafi pominac czesc plikow (r063).
# Plik i katalog variants/ kasujemy po wyborze wariantow.
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "52,372,445"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r066]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r066]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r066] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r066
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r066/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r066 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r066/v$v" 2>&1 | tee -a variants/r066/generate.log
          done
          ls -la variants/r066 variants/r066/v1 variants/r066/v2 variants/r066/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r066 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r066: 9 wariantow (3 karty x 3) + log generacji [import-r066]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
