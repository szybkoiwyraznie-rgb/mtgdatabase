name: "TEMP r087 - 12 i 332: 2 x 5"

# r087: 2 karty x 5 = 400 kredytow.
# 12  Merchant's Dockhand  robot_servo   1,80 s  n85=0
# 332 Blitz of the Thunder-Raptor thunder_clap 2,29 s n85=0
# Bez twardego attack_s<=0.15 i decay_s<=0.8 (wniosek z r086).

on:
  push:
    branches:
      - arena/a9d0a113-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "12,332"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/a9d0a113-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r087]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r087]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r087] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 5 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r087
          for v in 1 2 3 4 5; do
            echo "=== wariant v$v ===" | tee -a variants/r087/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r087 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r087/v$v" 2>&1 | tee -a variants/r087/generate.log
          done

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r087 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r087: 10 wariantow (2 karty x 5) + log generacji [import-r087]"
            git push origin HEAD:arena/a9d0a113-mtgdatabase
          fi
