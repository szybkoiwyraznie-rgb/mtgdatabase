name: "TEMP b076 - 9 nowych kart x 3"

on:
  push:
    branches:
      - arena/ee59daa7-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "353,356,357,359,361,363,364,365,368"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/ee59daa7-mtgdatabase
      - name: Guard — tylko commit z markerem [generate-b076]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-b076]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-b076] — nic nie generuję"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"
      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json
      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/b076
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/b076/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --force --retries 3 --prompt-influence 0.35 \
              --out "variants/b076/v$v" 2>&1 | tee -a variants/b076/generate.log
          done
      - name: Commit variants
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/b076 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then echo nic; else
            git commit -m "b076: 27 wariantow (9 nowych kart x 3) + log generacji [import-b076]"
            git push origin HEAD:arena/ee59daa7-mtgdatabase
          fi
