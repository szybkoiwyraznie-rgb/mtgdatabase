name: TEMP r016 warianty archetypowe

# TYMCZASOWY: pilot archetypowy. Token bota Arena ma HTTP 403 na
# workflow_dispatch, a sandbox nie sięga *.blob.core.windows.net, więc warianty
# generujemy z triggera push markerowanego ([generate-r016]) i commitujemy je
# na gałąź sesji. Plik i katalog variants/ kasujemy po wyborze.

on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "387,396,452,464,539"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r016]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r016]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r016] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          for v in 1 2 3; do
            echo "=== wariant v$v ==="
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r016 --force --prompt-influence 0.35 \
              --out "variants/r016/v$v"
          done
          ls -la variants/r016/v1 variants/r016/v2 variants/r016/v3

      - name: Commit variants back to the session branch
        if: steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add variants data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r016: 15 wariantów archetypowych (5 kart x 3) [import-r016]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
