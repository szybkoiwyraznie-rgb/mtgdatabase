name: "TEMP r076 - 156, 534, 548: krotki zanik, wolne regiony"

# r076: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
# Po tej paczce na drugim kluczu zostanie 6400.
#
#  156 heavy_impact  tresc 2,09 s  luka 0,42 s  2 flagi  0 sasiadow >=0,80
#  534 plate_clank   tresc 2,73 s  luka 0,44 s           0 sasiadow >=0,80
#  548 plate_clank   tresc 2,68 s  luka 0,50 s           0 sasiadow >=0,80
#
# Wybor idzie po dwoch kryteriach wypracowanych w r074 i r075.
#
# PO PIERWSZE: kontrakt z KROTKIM zanikiem. r075 pokazala, ze
# plate_clank (decay_s <= 1,2) przyjal lancuch zdarzen bez walki —
# szesc z szesciu wariantow trafionych. Archetypy wymagajace
# dlugiego zaniku (thunder_clap, stone_slide, earth_rumble,
# creature_roar) wpadaja w ten sam zajety rog, bo ogon to wlasnie
# to, co maja wspolne z istniejacym klastrym 317/558/562/496.
# Tam, gdzie kontrakt kaze gasnac, lancuch zdarzen jest bezpieczny.
# heavy_impact (decay_s <= 1,4) i plate_clank (<= 1,2) sa w tej
# grupie.
#
# PO DRUGIE: region wolny. Wszystkie trzy karty maja ZERO sasiadow
# o kosinusie >= 0,80 i zero >= 0,85.
#
#  156  najblizszy 0,7635 | >=0,80: 0 | >=0,85: 0
#  534  najblizszy 0,7726 | >=0,80: 0 | >=0,85: 0
#  548  najblizszy 0,6254 | >=0,80: 0 | >=0,85: 0
#
# 156 — jedyna karta w tej transzy, ktora ma flagi: `boomy` i
# `long_trail_silence`, czyli dwie z 38 w calym korpusie. Jej
# obecny prompt konczy sie na „a short sharp crack of stone",
# po czym model zostawia prawie dwie sekundy ciszy (trail). Jesli
# lancuch czterech uderzen wypelni take, wejda trzy rzeczy naraz:
# dlugosc, obie flagi i brak ciszy. heavy_impact wymaga przy tym
# attack_s <= 0,15, wiec „in the first instant" jest obowiazkowe.
#
# 534 i 548 — plate_clank, ten sam szkielet co 567 i 216 w r075:
# cztery trzaski, bez wybrzmiewania, „striking to the end".
# Rozni je tylko material w otwarciu (pancerz na ciele / naramienniki).
#
# Uwaga z r075: zajetosc liczyc tez PO wygenerowaniu. 524 miala zero
# sasiadow przed runda, a jej v1 i tak zrobila pare 0,9316 z karta
# 243. Region wokol OBECNEGO sampla bywa pusty, a region docelowy
# juz nie.
#
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "156,534,548"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r076]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r076]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r076] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r076
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r076/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r076 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r076/v$v" 2>&1 | tee -a variants/r076/generate.log
          done
          ls -la variants/r076 variants/r076/v1 variants/r076/v2 variants/r076/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r076 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r076: 9 wariantow (3 karty x 3) + log generacji [import-r076]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
