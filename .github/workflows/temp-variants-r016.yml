name: TEMP r030 cecha chroniona pierwsza

# TYMCZASOWY / ZAPARKOWANY: pilot archetypowy.
# 2026-10-05: klucz odnowiony (10 000 kredytow, 40 na generacje). Workflow bez
# markera nic nie robi, wiec CI pozostaje zielone. Token bota Arena ma HTTP 403 na
# workflow_dispatch, a sandbox nie siega *.blob.core.windows.net (nie da sie
# pobrac logow runa), wiec warianty generujemy z triggera push markerowanego
# ([generate-r030]) i commitujemy na galaz sesji razem z logiem generacji -
# log w repo to jedyny sposob, zeby zobaczyc blad API z sandboxa.
#
# r030: 2 warianty x 19 kart = 38 generacji x 40 kredytow = 1520 kredytow.
# RUNDA WYNIKA WPROST Z POMIARU r030. Wtedy prompt pod jedna ceche naprawial ja,
# ale model rozstrzygal konflikt kosztem innej cechy w tej samej rodzinie:
#   sword_clash  dostal szumowy transient i stracil attack_s (0,14-0,52 s przy <= 0,1)
#   robot_servo  dostal cztery kliky i stracil tonal (0,040 i 0,000 przy >= 0,35)
#   insect_swarm dostal nizszy centroid i stracil tonal (0,22 przy >= 0,3)
#   door_creak   dostal szybkie falowanie i stracil tonalnosc
# Dlatego teraz cecha CHRONIONA idzie w prompcie PIERWSZA i jako element
# dominujacy, a poprawka dopiero po niej, np. robot_servo: 'One continuous clean
# tone at a constant pitch, dominant and unbroken ... with just two very soft
# clicks barely audible over it' - ton najpierw, klik jako dodatek.
# 19 kart to wszystkie grupy >= 2 sposrod 49 pozostalych 'prawdopodobnie':
#   sword_clash/flatness 5 | insect_swarm/centroid 4 | door_creak/mod_peak 3
#   wind_gust/centroid 3 | door_creak/decay 2 | robot_servo/onset 2
# door_creak/mod_peak ma oba kierunki: 95 przestrzelil w gore (19,76 Hz po
# prompcie 'several times per second'), a 303 i 531 sa za wolne (1,03 i 1,40 Hz),
# wiec cel to srodek okna: 'about five or six times a second'.
# Postprocess zawsze z --ids ograniczonym do batchu: w r030 uruchomiony globalnie
# zmienil 540 z 553 plikow, a --fix-mono podnosi podobienstwo i wypchnal pare
# 529/592 na cosine 0,9501 - nowego blizniaka nad progiem 0,95.
# Plik i katalog variants/ kasujemy po wyborze wariantow.
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "17,20,345,435,608,81,98,106,456,95,303,531,103,492,513,381,537,204,611"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r030]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r030]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r030] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r030
          for v in 1 2; do
            echo "=== wariant v$v ===" | tee -a variants/r030/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r030 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r030/v$v" 2>&1 | tee -a variants/r030/generate.log
          done
          ls -la variants/r030 variants/r030/v1 variants/r030/v2 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r030 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r030: 70 wariantow archetypowych (35 kart x 2) + log generacji [import-r030]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
