name: "TEMP r070 - 224, 308 i 452: sprawdzony wzorzec na dwa miecze"

# r070: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
# Po tej paczce na drugim kluczu zostanie 8560.
#
#  308 sword_clash   tresc 2,06 s  luka 0,98 s  7 prob  fill-take
#  452 arcane_choir  tresc 2,60 s  luka 0,70 s  4 prob  bez fill-take, muzyka
#  224 sword_clash   tresc 2,47 s  luka 0,57 s  2 prob  bez fill-take
#
# 308 — PRZYPADEK GRANICZNY. W r068 lamala attack_s (1,25-2,40).
# W r069 wzorzec z karty 334 naprawil atak: v1 mial attack 0,020 i byl
# TRAFIONY, ale wyszedl za krotki — 1,66 s przy obecnych 2,06 s.
# Regula 1 pozwala instalowac tylko to, co nie psuje werdyktu, a
# skrocenie z 2,06 do 1,66 by go popsulo w druga strone. Wiec nie
# instalujemy i probujemy raz jeszcze: ten sam wzorzec plus trzecie
# zdarzenie („then a third crack"), zeby wydluzyc.
#
# 452 — chór. arcane_choir wymaga tonal_frame >= 0,45, voiced >= 0,25,
# sustain >= 0,35 i decay >= 0,8. Głosy naturalnie dają wszystkie
# cztery. Obecny prompt jest samymi przymiotnikami („mystical",
# „soft", „harmonious") i nie ma lancucha. Lancuch z akordow,
# bez przymiotnikow. Uwaga: karta ma music_allowed = true, czyli
# prompt NIE dostaje sufiksu NO_M i musi nazywac zrodlo — chór je
# nazywa.
#
# 224 — ta sama os co 308, ale karta swieza (tylko 2 przejscia) i
# z promptem, ktory w ogole nie jest lancuchem: „Slow metallic
# ticking and pinging of hot sword blades cooling". Dostaje ten sam
# sprawdzony wzorzec co 308. Jesli zadziala na obu, bedzie to
# najmocniejszy dotad dowód, ze wzorzec jest przenosny; jesli na
# zadnej — ze 308 ma pecha do swoich rzeczownikow.

on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "224,308,452"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r070]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r070]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r070] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r070
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r070/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r070 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r070/v$v" 2>&1 | tee -a variants/r070/generate.log
          done
          ls -la variants/r070 variants/r070/v1 variants/r070/v2 variants/r070/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r070 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r070: 9 wariantow (3 karty x 3) + log generacji [import-r070]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
