name: "TEMP r077 - 548, 491, 140: clashing zamiast turning"

# r077: 3 karty x 3 warianty = 9 generacji x 40 kredytow = 360 kredytow.
# Po tej paczce na drugim kluczu zostanie 6040.
#
#  548 plate_clank  tresc 2,68 s  luka 0,50 s  4 prob  0 sasiadow >=0,80
#  491 plate_clank  tresc 2,67 s  luka 0,51 s  2 prob  0 sasiadow >=0,80
#  140 plate_clank  tresc 2,70 s  luka 0,48 s  2 prob  0 sasiadow >=0,80
#
# Wszystkie trzy: kontrakt z KROTKIM zanikiem (plate_clank,
# decay_s <= 1,2) i region WOLNY (zero sasiadow >= 0,80 i >= 0,85).
#
# 548 — POWROT po r076, gdzie wszystkie trzy warianty wyszly
# krotsze (2,38 / 3,14 / 2,50 s). Winno jest otwarcie: „Armoured
# shoulders TURNING". „turning" to powolna czynnosc, wiec model
# dostal sygnal, ze ma czas. W r074 zapisalam regule — MATERIAL TO
# RZECZOWNIK, CZYNNOSC TO CZASOWNIK — i wlasnie ja zlamalam
# wlasnorecznie, dwa wpisy pozniej. Teraz jest „Steel plates
# CLASHING on a shoulder": rzeczownik (plates) + czasownik
# uderzenia (clashing). To jawny test, czy regula dziala takze
# w druga strone.
#
# 491 — inny material niz stal: KORA. Otwarcie „Bark plates
# snapping onto an arm". Roznicowanie materialem, nie liczba
# zdarzen — 548 i 140 sa obie stalowe, wiec 491 jest ta karta,
# ktora ma trzymac transze z dala od blizniactwa.
#
# 140 — „Steel plates clashing on a chest". Otwarcie mowilo
# „A fighter rolling up from a packed yard": rolling tez jest
# powolna czynnosc, wiec idzie do wymiany na ten sam powod co 548.
#
# Szkielet wszystkich trzech jest ten sam co w 216 i 567 w r075:
# cztery trzaski bez wybrzmiewania, „striking to the end".
#
on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "140,491,548"

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r077]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r077]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r077] — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Generate 3 variants per story
        if: steps.guard.outputs.run == '1'
        continue-on-error: true
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          mkdir -p variants/r077
          for v in 1 2 3; do
            echo "=== wariant v$v ===" | tee -a variants/r077/generate.log
            python scripts/elevenlabs_sample_scout.py \
              --scenarios "$SCENARIOS" --manifest "$MANIFEST" \
              --ids "$IDS" --batch r077 --force --retries 3 --prompt-influence 0.35 \
              --out "variants/r077/v$v" 2>&1 | tee -a variants/r077/generate.log
          done
          ls -la variants/r077 variants/r077/v1 variants/r077/v2 variants/r077/v3 || true

      - name: Commit variants and log back to the session branch
        if: always() && steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f variants/r077 data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r077: 9 wariantow (3 karty x 3) + log generacji [import-r077]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
