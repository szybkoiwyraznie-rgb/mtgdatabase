name: Build signatures release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audio/signatures/**'
      - 'scripts/build_pack.py'
      - '.github/workflows/release-signatures.yml'

permissions:
  contents: write

jobs:
  release:
    # Wydanie jest publikacją publiczną: tylko z main (LESSONS 2026-09-22).
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build flat ZIP
        run: python scripts/build_pack.py --output signatures-latest.zip
      - name: Encrypt ZIP when password is configured
        env:
          ZIP_PASSWORD: ${{ secrets.JINGLE_ZIP_PASSWORD }}
        run: |
          if [ -n "$ZIP_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
            7z a -tzip -mem=AES256 -p"$ZIP_PASSWORD" signatures-latest-protected.zip signatures-latest.zip >/dev/null
            mv signatures-latest-protected.zip signatures-latest.zip
          fi
      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view signatures-latest >/dev/null 2>&1 || gh release create signatures-latest --title "Story signatures (latest)" --notes "Płaski ZIP: <id>.mp3 z audio/signatures. Aktualizowany automatycznie."
          gh release upload signatures-latest signatures-latest.zip --clobber
