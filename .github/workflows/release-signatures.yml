# Nudge push 2026-09-28: re-trigger after a dropped push-to-main event on PR #40
# (GitHub Actions push-webhook throttling after a high-volume push burst; see docs/STATE.md).
name: Build sample release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audio/samples/**'
      - 'scripts/build_pack.py'
      - '.github/workflows/release-signatures.yml'

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build flat ZIP
        run: python scripts/build_pack.py --output samples-latest.zip
      - name: Encrypt ZIP when password is configured
        env:
          ZIP_PASSWORD: ${{ secrets.JINGLE_ZIP_PASSWORD }}
        run: |
          if [ -n "$ZIP_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
            7z a -tzip -mem=AES256 -p"$ZIP_PASSWORD" samples-latest-protected.zip samples-latest.zip >/dev/null
            mv samples-latest-protected.zip samples-latest.zip
          fi
      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view samples-latest >/dev/null 2>&1 || gh release create samples-latest --title "Story samples (latest)" --notes "Płaski ZIP: <id>.mp3 z audio/samples. Aktualizowany automatycznie."
          gh release upload samples-latest samples-latest.zip --clobber
