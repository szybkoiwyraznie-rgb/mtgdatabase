name: TEMP b056b (remove after use)

# Tymczasowy workflow: dostawa b056 — nowa fabula 176FIN Chocobo Kick.
# Marker w tresci commita: [generate-b056b]

on:
  push:
    branches: ["arena/**"]

permissions:
  contents: write

jobs:
  generate-b056b:
    if: startsWith(github.event.head_commit.message, '[generate-b056b]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh catalog from collection
        run: python scripts/import_collection.py fabuły270926.csv --output data/catalog.json
      - name: Validate scenarios
        run: python scripts/validate_sample_scenarios.py data/samples/scenarios.jsonl --catalog data/catalog.json
      - name: Dry run scout
        run: python scripts/elevenlabs_sample_scout.py --batch b056b --limit 1 --force --dry-run
      - name: Generate MP3 with ElevenLabs
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          set +e
          python scripts/elevenlabs_sample_scout.py --batch b056b --limit 1 --force \
            --prompt-influence 0.35 > out.log 2> err.log
          code=$?
          set -e
          # Logi runu sa niepobieralne z piaskownicy, wiec przenosimy tresc
          # bledu do adnotacji, ktora da sie odczytac przez API.
          {
            echo '### stdout'; tail -c 2000 out.log
            echo '### stderr'; tail -c 2000 err.log
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 900 err.log | tr '\n' ' ' | tr -d '\r')
            echo "::error title=scout-failed::exit=$code $msg"
            exit "$code"
          fi
          cat out.log
      - name: Verify generated output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          want = {'176'}
          rows = [json.loads(l) for l in open('data/samples/generated-manifest.jsonl', encoding='utf-8') if l.strip()]
          tail = rows[-1:]
          bad = [r for r in tail if r.get('status') != 'generated']
          assert not bad, f'nie wszystkie generated: {bad[:5]}'
          assert {r.get('story_id') for r in tail} == want, 'niezgodny zestaw ID'
          assert Path('audio/samples/176.mp3').stat().st_size > 10000, 'plik 176.mp3 podejrzanie maly'
          print('OK', len(tail))
          PY
      - name: Upload raw artifact (b056b-raw)
        uses: actions/upload-artifact@v4
        with:
          name: b056b-raw
          path: audio/samples/176.mp3
          if-no-files-found: error
          retention-days: 30
      - name: Commit and push b056 sample
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add audio/samples data/samples/generated-manifest.jsonl
          git commit -m "b056b: regeneracja sampla 176 Chocobo Kick z runu ${GITHUB_RUN_ID}"
          git push
