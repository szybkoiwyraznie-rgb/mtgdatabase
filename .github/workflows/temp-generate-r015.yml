name: TEMP r015b generate + import

# TYMCZASOWY workflow rundy r015b (3 sample, które nie wyszły w r015: 290 sub-bas, 504 tonalny łomot, 567 za krótka treść).
# Token bota Arena nie może odpalić workflow_dispatch (HTTP 403), a sandbox nie
# ma dostępu do *.blob.core.windows.net, więc artefaktu nie da się pobrać
# lokalnie. Dlatego generacja idzie z triggera push markerowanego w wiadomości
# commitu ([generate-r015b]) i od razu commituje MP3 z powrotem na gałąź sesji.
# Plik usuwamy po imporcie — workflow `ai-sfx-elevenlabs.yml` na main zostaje
# manualny.

on:
  push:
    branches:
      - arena/01a108e2-mtgdatabase

permissions:
  contents: write

env:
  SCENARIOS: data/samples/scenarios.jsonl
  OUT_DIR: audio/samples
  MANIFEST: data/samples/generated-manifest.jsonl
  IDS: "290,504,567"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a108e2-mtgdatabase

      - name: Guard — tylko commit z markerem [generate-r015b]
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -qF '[generate-r015b]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "brak markera [generate-r015b] w HEAD — nic nie generuję"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: Refresh catalog from collection
        if: steps.guard.outputs.run == '1'
        run: python scripts/import_collection.py "fabuły270926.csv" --output data/catalog.json

      - name: Validate scenarios
        if: steps.guard.outputs.run == '1'
        run: python scripts/validate_sample_scenarios.py "$SCENARIOS" --catalog data/catalog.json

      - name: Dry run
        if: steps.guard.outputs.run == '1'
        run: python scripts/elevenlabs_sample_scout.py --scenarios "$SCENARIOS" --ids "$IDS" --dry-run

      - name: Generate MP3s with ElevenLabs
        if: steps.guard.outputs.run == '1'
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          python scripts/elevenlabs_sample_scout.py \
            --scenarios "$SCENARIOS" \
            --out "$OUT_DIR" \
            --manifest "$MANIFEST" \
            --ids "$IDS" \
            --force \
            --prompt-influence 0.35

      - name: Stage raw copies for the artifact
        if: steps.guard.outputs.run == '1'
        run: |
          mkdir -p build/r015b-raw
          IFS=',' read -ra LIST <<< "$IDS"
          for id in "${LIST[@]}"; do cp "$OUT_DIR/$id.mp3" "build/r015b-raw/$id.mp3"; done
          ls -la build/r015b-raw

      - name: Upload raw artifact (surowe, przed postprodukcją)
        if: steps.guard.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: r015b-raw
          path: build/r015b-raw
          if-no-files-found: error

      - name: Commit generated samples back to the session branch
        if: steps.guard.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/samples data/samples/generated-manifest.jsonl
          if git diff --cached --quiet; then
            echo "nic do zacommitowania"
          else
            git commit -m "r015b: surowe sample z ElevenLabs (290, 504, 567) [import-r015b]"
            git push origin HEAD:arena/01a108e2-mtgdatabase
          fi
