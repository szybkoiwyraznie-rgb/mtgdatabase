name: TEMP r014 refresh semantic audit

on:
  push:
    branches:
      - arena/01a10303-mtgdatabase

permissions:
  contents: write

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[audit-r014]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy soundfile
      - name: Refresh semantic audit against the final r014 scenario
        run: |
          python scripts/audit_semantic_match.py \
            --audit data/samples/audio-audit-2026-10-04-after-r014.json \
            --json data/samples/semantic-audit-2026-10-04-after-r014.json \
            --markdown docs/audits/2026-10-04-semantic-match-r014.md \
            --top 60
      - name: Commit refreshed report and remove temporary workflow
        run: |
          rm -f .github/workflows/temp-r014-semantic-audit.yml
          git config user.name "arena-ai[bot]"
          git config user.email "arena-ai[bot]@users.noreply.github.com"
          git add data/samples/semantic-audit-2026-10-04-after-r014.json \
                  docs/audits/2026-10-04-semantic-match-r014.md \
                  .github/workflows/temp-r014-semantic-audit.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh r014 semantic report after demon-roar clarification"
            git push origin HEAD:arena/01a10303-mtgdatabase
          fi
