name: Publish sample library

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collection
        run: python scripts/validate_stories.py fabuły270926.csv
      - name: Refresh catalog
        run: python scripts/import_collection.py fabuły270926.csv --output data/catalog.json
      - name: Validate scenarios
        run: python scripts/validate_sample_scenarios.py data/samples/scenarios.jsonl --catalog data/catalog.json
      - name: Build sample library
        run: python scripts/build_site.py --out site/generated
      - name: Verify Pages payload
        run: |
          test -f site/generated/index.html
          MP3_COUNT=$(find site/generated/samples -maxdepth 1 -type f -name '*.mp3' | wc -l)
          SCEN_COUNT=$(wc -l < data/samples/scenarios.jsonl)
          echo "MP3 w payload: $MP3_COUNT; scenariusze: $SCEN_COUNT"
          test "$MP3_COUNT" -eq "$SCEN_COUNT" -a "$MP3_COUNT" -gt 0
          ! find site/generated -type f \( -path '*/audio/signatures/*' -o -path '*/audio/library/*' -o -path '*/data/gates/*' \) | grep -q .
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/generated

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
