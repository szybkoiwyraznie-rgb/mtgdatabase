name: Publish signature gallery

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collection
        run: python scripts/validate_stories.py kolekcja.csv
      - name: Refresh catalog
        run: python scripts/import_collection.py kolekcja.csv --output data/catalog.json
      - name: Build gallery
        run: python scripts/build_site.py --out site/generated
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/generated

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
