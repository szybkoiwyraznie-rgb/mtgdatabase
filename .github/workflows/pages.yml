name: Publish Pages preview

on:
  workflow_dispatch:
  push:
    branches: [main, arena/01a0c595-mtgdatabase]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collection
        run: python scripts/validate_stories.py kolekcja.csv
      - name: Import collection
        run: python scripts/import_collection.py kolekcja.csv --output /tmp/catalog.json
      - name: Build static preview
        run: python scripts/build_site.py --catalog /tmp/catalog.json --output _site --audio-root legacy/source/jingle_output
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
