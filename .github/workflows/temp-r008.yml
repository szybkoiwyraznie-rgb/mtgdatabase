name: TEMP r008 (remove after use)

# Tymczasowy workflow: runda r008 (9 sampli) — sample muzyczne
# tam, gdzie fabula stawia instrument w kadrze (music_allowed).
# Marker w tresci commita: [generate-r008]

on:
  push:
    branches: ["arena/**"]

permissions:
  contents: write

jobs:
  generate-r008:
    if: startsWith(github.event.head_commit.message, '[generate-r008]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh catalog from collection
        run: python scripts/import_collection.py fabuły270926.csv --output data/catalog.json
      - name: Validate scenarios
        run: python scripts/validate_sample_scenarios.py data/samples/scenarios.jsonl --catalog data/catalog.json
      - name: Dry run scout
        run: python scripts/elevenlabs_sample_scout.py --batch r008 --limit 9 --force --dry-run
      - name: Regenerate MP3s with ElevenLabs
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: python scripts/elevenlabs_sample_scout.py --batch r008 --limit 9 --force --prompt-influence 0.35
      - name: Verify regenerated outputs
        run: |
          python3 - <<'PY'
          import json
          want = {'195', '231', '251', '253', '262', '298', '367', '374', '510'}
          rows = [json.loads(l) for l in open('data/samples/generated-manifest.jsonl', encoding='utf-8') if l.strip()]
          tail = rows[-9:]
          bad = [r for r in tail if r.get('status') != 'generated']
          assert not bad, f'nie wszystkie generated: {bad[:5]}'
          assert {r.get('story_id') for r in tail} == want, 'niezgodny zestaw ID'
          print('OK', len(tail))
          PY
      - name: Upload raw artifact (r008-raw)
        uses: actions/upload-artifact@v4
        with:
          name: r008-raw
          path: audio/samples/
          if-no-files-found: error
          retention-days: 30
      - name: Commit and push r008 samples
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add audio/samples data/samples/generated-manifest.jsonl
          git commit -m "r008: regeneracja 9 sampli muzycznych z runu ${GITHUB_RUN_ID}"
          git push
