name: TEMP b055 (remove after use)

# Tymczasowy workflow: generacja paczki b055 (167, 170, 174) przez ElevenLabs
# bez workflow_dispatch (bot nie ma uprawnien). Marker w tresci commita:
#   [generate-b055] ...
# Po imporcie sampli i domknieciu PR ten plik zostaje usuniety.

on:
  push:
    branches: ["arena/**"]

permissions:
  contents: write

jobs:
  generate-b055:
    if: startsWith(github.event.head_commit.message, '[generate-b055]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh catalog from collection
        run: python scripts/import_collection.py fabuły270926.csv --output data/catalog.json

      - name: Validate scenarios
        run: python scripts/validate_sample_scenarios.py data/samples/scenarios.jsonl --catalog data/catalog.json

      - name: Dry run scout
        run: python scripts/elevenlabs_sample_scout.py --batch b055 --limit 3 --dry-run

      - name: Generate MP3s with ElevenLabs
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: python scripts/elevenlabs_sample_scout.py --batch b055 --limit 3 --prompt-influence 0.35

      - name: Verify generated outputs
        run: |
          set -euo pipefail
          ls -la audio/samples/167.mp3 audio/samples/170.mp3 audio/samples/174.mp3
          python3 - <<'PY'
          import json
          rows = [json.loads(l) for l in open('data/samples/generated-manifest.jsonl', encoding='utf-8') if l.strip()]
          tail = rows[-3:]
          for r in tail:
              print(r.get('story_id'), r.get('batch'), r.get('status'))
          assert all(r.get('status') == 'generated' for r in tail), 'not all b055 rows generated'
          assert {r.get('story_id') for r in tail} == {'167', '170', '174'}, 'unexpected manifest tail'
          PY

      - name: Upload raw artifact (b055-raw)
        uses: actions/upload-artifact@v4
        with:
          name: b055-raw
          path: |
            audio/samples/167.mp3
            audio/samples/170.mp3
            audio/samples/174.mp3
          if-no-files-found: error

      - name: Commit and push b055 samples
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add audio/samples/167.mp3 audio/samples/170.mp3 audio/samples/174.mp3 data/samples/generated-manifest.jsonl
          git commit -m "b055: import sampli 167/170/174 z runu ${GITHUB_RUN_ID}"
          git push
