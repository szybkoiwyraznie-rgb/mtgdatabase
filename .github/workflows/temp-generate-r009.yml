name: TEMP generate r009b (ElevenLabs)

# Tymczasowy workflow: regeneracja sampli 192 i 445 z przepisanymi promptami
# (445 wpadło w pułapkę basową, 192 utworzyło parę bliźniaczą z 401).
# Wyrównanie postprodukcją do -20 LUFS i commit z powrotem na gałąź.
# Marker w commicie: [generate-r009b]. Do usunięcia po imporcie.

on:
  push:
    branches: [arena/01a0f100-mtgdatabase]

permissions:
  contents: write

jobs:
  gen:
    if: contains(github.event.head_commit.message, '[generate-r009b]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a0f100-mtgdatabase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audio deps
        run: pip install --quiet numpy scipy soundfile

      - name: Refresh catalog from collection
        run: python scripts/import_collection.py fabuły270926.csv --output data/catalog.json

      - name: Validate scenarios
        run: python scripts/validate_sample_scenarios.py data/samples/scenarios.jsonl --catalog data/catalog.json

      - name: Generate MP3s with ElevenLabs
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: |
          python scripts/elevenlabs_sample_scout.py \
            --ids 192,445 --force

      - name: Archive raw originals as artifact
        run: |
          mkdir -p raw_upload
          for id in 192 445; do cp "audio/samples/$id.mp3" "raw_upload/$id.mp3"; done

      - uses: actions/upload-artifact@v4
        with:
          name: r009b-raw
          path: raw_upload/
          retention-days: 30
          if-no-files-found: error

      - name: Postprocess to -20 LUFS / -1 dBTP
        run: |
          python scripts/postprocess_samples.py \
            --ids 192,445 \
            --report data/samples/postprocess-r009b.json

      - name: Commit generated + processed files back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/samples/192.mp3 audio/samples/445.mp3 \
                  data/samples/generated-manifest.jsonl \
                  data/samples/postprocess-r009b.json
          git commit -m "CI: regeneracja i wyrownanie sampli 192,445 (skip-generate)"
          git push origin HEAD:arena/01a0f100-mtgdatabase
