name: TEMP r007b (remove after use)

# Tymczasowy workflow: regeneracja rundy r007b (6 sampli) przez ElevenLabs.
# Marker w tresci commita: [generate-r007b]
# Po imporcie i domknieciu PR ten plik zostaje usuniety.

on:
  push:
    branches: ["arena/**"]

permissions:
  contents: write

jobs:
  generate-r007b:
    if: startsWith(github.event.head_commit.message, '[generate-r007b]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh catalog from collection
        run: python scripts/import_collection.py fabuły270926.csv --output data/catalog.json

      - name: Validate scenarios
        run: python scripts/validate_sample_scenarios.py data/samples/scenarios.jsonl --catalog data/catalog.json

      - name: Dry run scout
        run: python scripts/elevenlabs_sample_scout.py --batch r007b --limit 6 --force --dry-run

      - name: Regenerate MP3s with ElevenLabs
        env:
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_SOUNDGEN_ENDPOINT: ${{ secrets.ELEVENLABS_SOUNDGEN_ENDPOINT }}
        run: python scripts/elevenlabs_sample_scout.py --batch r007b --limit 6 --force --prompt-influence 0.35

      - name: Verify regenerated outputs
        run: |
          python3 - <<'PY'
          import json
          want = {'17', '40', '59', '286', '290', '497'}
          rows = [json.loads(l) for l in open('data/samples/generated-manifest.jsonl', encoding='utf-8') if l.strip()]
          tail = rows[-6:]
          got = {r.get('story_id') for r in tail}
          bad = [r for r in tail if r.get('status') != 'generated']
          print('wygenerowano:', len(tail), 'bledy:', len(bad))
          assert not bad, f'nie wszystkie generated: {bad[:5]}'
          assert got == want, f'brakuje: {want - got}, nadmiar: {got - want}'
          PY

      - name: Upload raw artifact (r007b-raw)
        uses: actions/upload-artifact@v4
        with:
          name: r007b-raw
          path: audio/samples/
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push r007b samples
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add audio/samples data/samples/generated-manifest.jsonl
          git commit -m "r007b: regeneracja 6 sampli z runu ${GITHUB_RUN_ID}"
          git push
